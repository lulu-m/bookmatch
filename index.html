const TINT_K=.05;   // part de la couleur dans le fond (5 %)
const TINT=(()=>{ try{ return JSON.parse(localStorage.getItem("bm-tint")||"{}"); }catch(e){ return {}; } })();
const tintBg=([r,g,b])=>`rgb(${Math.round(255+(r-255)*TINT_K)},${Math.round(255+(g-255)*TINT_K)},${Math.round(255+(b-255)*TINT_K)})`;
function saveTint(id,c){ TINT[id]=c; try{ localStorage.setItem("bm-tint",JSON.stringify(TINT)); }catch(e){} }
// Couleur dominante : on regroupe les pixels colorés par teinte et on garde le groupe le plus présent
function dominant(img){
  const c=document.createElement("canvas"); c.width=24; c.height=36; const x=c.getContext("2d",{willReadFrequently:true});
  x.drawImage(img,0,0,24,36); const d=x.getImageData(0,0,24,36).data, bins={}; let all=[0,0,0,0];
  for(let i=0;i<d.length;i+=4){ const r=d[i],g=d[i+1],b=d[i+2], mx=Math.max(r,g,b), mn=Math.min(r,g,b), sat=mx?(mx-mn)/mx:0;
    all[0]+=r; all[1]+=g; all[2]+=b; all[3]++;
    if(sat<.25||mx<40||mn>235) continue;                          // gris, noir et blanc ne comptent pas
    let h; if(mx===r) h=((g-b)/(mx-mn))%6; else if(mx===g) h=(b-r)/(mx-mn)+2; else h=(r-g)/(mx-mn)+4;
    const k=Math.round(((h*60+360)%360)/30)%12, o=bins[k]||(bins[k]=[0,0,0,0]); o[0]+=r*sat; o[1]+=g*sat; o[2]+=b*sat; o[3]+=sat; }
  const best=Object.values(bins).sort((a,b)=>b[3]-a[3])[0];
  return best&&best[3]>2?[best[0]/best[3],best[1]/best[3],best[2]/best[3]].map(Math.round):[all[0]/all[3],all[1]/all[3],all[2]/all[3]].map(Math.round);
}
const hexRgb=h=>{ const m=(h||"").replace("#",""); return m.length===6?[0,2,4].map(i=>parseInt(m.slice(i,i+2),16)):null; };
function tintCards(){
  document.querySelectorAll(".rc-top[data-tint]").forEach(el=>{
    const id=el.dataset.tint, b=BY[id]; if(!b||el.dataset.done) return; el.dataset.done=1;
    const apply=c=>{ if(!c) return; saveTint(id,c); el.style.background=tintBg(c); };
    if(TINT[id]) return apply(TINT[id]);
    // Couverture générée : la couleur de son univers
    if(!REAL_COVERS.has(id)&&!(b.cover&&!RM_BAD.has(b.cover))) return apply(hexRgb(CL_COLOR[b.univ[0]]||"#3A2E1E"));

    const src=REAL_COVERS.has(id)?coverSrc(id,132):"https://wsrv.nl/?w=48&output=jpg&url="+encodeURIComponent(b.cover), im=new Image();
    im.crossOrigin="anonymous"; im.referrerPolicy="no-referrer";
    im.onload=()=>{ try{ apply(dominant(im)); }catch(e){ /* image d'un autre site sans autorisation : on garde le gris */ } };
    im.src=src;
  });
}

  author(s){
    const a=s.a||"", na=norm(a), p=derive();
    if(na.length>=3&&!REMOTE[na]) remoteSearch(a,()=>render());
    const seen=new Set(), own=[];
    [...BOOKS.filter(b=>norm(b.author)===na),...remoteIds(a).map(id=>BY[id]).filter(b=>b&&norm(b.author).includes(na))]
      .forEach(b=>{ if(!seen.has(b.id)){ seen.add(b.id); own.push(b); } });
    // Date de parution (jour précis si connu, sinon l'année) et filtre Parus / À paraître
    const relD=b=>b.recent||(b.year?b.year+"-01-01":""), td=today();
    const soon=b=>!!b.future||(!!b.recent&&b.recent>td)||(!!b.year&&b.year>+td.slice(0,4));
    const out=own.filter(b=>!soon(b)).sort((x,y)=>relD(y).localeCompare(relD(x)));   // parus : du plus récent au plus ancien
    const up=own.filter(soon).sort((x,y)=>relD(x).localeCompare(relD(y)));           // à paraître : le plus proche d'abord
    const f=s.f||"out", shown=f==="up"?up:out;
    const dTxt=b=>soon(b)?(b.recent?"Sortie le "+new Date(b.recent).toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"}):b.year?"Sortie en "+b.year:"À paraître"):(b.recent?new Date(b.recent).toLocaleDateString("fr-FR",{month:"long",year:"numeric"}):b.year||"");

          <button role="tab" aria-selected="${f==="up"}" data-a="authorF" data-f="up">À paraître · ${up.length}</button></div>
        ${shown.length?shown.map(b=>bkRow(b,null,[b.genre,dTxt(b)].filter(Boolean).join(" · "))).join(""):`<p class="t-sub muted" style="padding:16px 0">${f==="up"?"Aucune sortie annoncée pour l'instant.":"Aucun livre paru dans le catalogue."}</p>`}`:(na.length>=3&&!REMOTE[na]?`<p class="t-sub muted" style="padding:24px 0">Recherche de ses livres…</p>`:"")}
      ${like.length?`<section class="nu"><span class="ai-mark">Dans le même esprit</span><p class="t-sub muted">D'autres auteurs, choisis selon votre profil</p><div class="hrow" style="margin-top:12px">${like.map(b=>bkTile(b,b.author)).join("")}</div></section>`:""}
    </div><div style="height:60px"></div></div>`; },
  // Page dédiée à une envie : livres classés selon l'envie choisie ET le profil, envies voisines en puces
  mood(s){
    // Piste E : l'envie est découpée en nuances (sous-genres), chacune en ligne de livres classés selon le profil
    const m=s.m, keep=T.mood; T.mood=m;

    const nu=Object.entries(groups).filter(([,v])=>v.length>=3).sort((a,b)=>b[1].length-a[1].length).slice(0,4);
    const used=new Set(nu.flatMap(([,v])=>v.slice(0,10).map(x=>x.b.id)));
    const rest=all.filter(x=>!used.has(x.b.id)).slice(0,10);
    const chipsM=[m,...profileMoods(recList(p)).filter(k=>k!==m)].slice(0,8);
    const railH=(title,sub,items)=>`<section class="nu"><h2 class="t-title3">${esc(title)}</h2><p class="t-sub muted">${esc(sub)}</p>

      ${rest.length>=3?railH(nu.length?"Et aussi":"Pour votre envie","D'autres pistes qui y répondent",rest):""}

    </div><div style="height:60px"></div></div>`;

  // Page « Pour vous » : 20 recommandations, filtres rapides, Envie / Pas pour moi sur chaque ligne

    let L=recList(p);

  search(){ return `<div style="display:flex;align-items:center;gap:12px;padding:58px 20px 12px;flex:none">

  fiche(s){
    const b=BY[s.id], e=S.lib[b.id], p=derive(), r=score(b,p), w=why(b,p,r);
    // Livre du catalogue : on va chercher son résumé à l'ouverture de la fiche

      <span class="t-foot muted" style="margin-top:4px">${esc(b.genre)} · ${b.future?"À paraître":yearTxt(b.year)} · ${b.pages} pages</span>
      ${e?`<span class="tag" style="margin-top:12px;cursor:default;height:28px;font-size:13px">${esc(statusLine(b.id))}</span>`:""}</div>
      <div class="pad" style="padding-top:24px;display:flex;flex-direction:column;gap:24px">
        ${!e||e.status==="envie"?`<section class="ai">${AIMARK("Pourquoi ce livre")}<p class="ai-lead">${compatLabel(r.t)}</p><p class="t-body">${esc(whyShown(b,p,w))}</p>${w.src.length?`<div class="row-src">${w.src.map(id=>cover(BY[id],22,4)).join("")}<span class="t-foot muted">D'après ${w.src.length} livre${w.src.length>1?"s":""} de votre bibliothèque</span></div>`:""}</section>`:review}
        <section style="display:flex;flex-direction:column;gap:8px"><h2 class="t-head">Résumé</h2>${(()=>{ const t=b.long||b.sum||"", open=T.sumOpen===b.id, cut=t.length>700&&!open;
          if(!t) return `<p class="t-body"><span class="muted">${b._sq===1?"Recherche du résumé…":"Pas encore de résumé pour ce livre."}</span></p>`;
          return `<p class="t-body" style="white-space:pre-line">${esc(cut?t.slice(0,650).replace(/\s+\S*$/,"")+"…":t)}</p>${cut?`<button class="b b-text" data-a="sumMore" data-id="${b.id}" style="align-self:flex-start;padding:0;min-height:44px">Lire la suite</button>`:""}${!b.long&&b._sq===1?`<p class="t-foot muted">Recherche d'un résumé plus complet…</p>`:""}`; })()}${b.sumSrc==="wikipedia"?`<p class="t-foot muted" style="font-size:12px">Source : <a href="${esc(b.sumUrl||"https://fr.wikipedia.org/wiki/"+encodeURIComponent(b.title))}" target="_blank" rel="noopener" style="color:inherit">Wikipédia</a>, licence CC BY-SA.</p>`:b.sumSrc==="google"?`<p class="t-foot muted" style="font-size:12px">Source : Google Books (présentation de l'éditeur).</p>`:""}<div class="tags" style="margin-top:4px">${b.themes.map(t=>`<span class="t-foot muted" style="padding:4px 8px;border:1px solid var(--hairline);border-radius:10px">${esc(t)}</span>`).join("")}</div></section>
        <div class="group"><button class="row" data-a="editions" data-id="${b.id}"><span>Où l'acheter</span><span class="r">${b.future?"À paraître":"Libraires et sites"}${ico("chev","chev")}</span></button></div>
      </div><div style="height:130px"></div></div>
    <div style="position:absolute;left:0;right:0;bottom:0;padding:12px 20px 32px;background:var(--paper);border-top:.5px solid var(--hairline);display:flex;gap:8px">${actions}</div>`;
  },
  editions(s){
    const b=BY[s.id], f=s.fmt, ed=b.ed[f];
    const fm=[["poche","Poche"],["gf","Grand format"],["ebook","Numérique"],["audio","Audio"]];
    const pref=S.prefs.achat; let ms=f==="audio"?[AUDIO_M]:MERCHANTS.filter(m=>f!=="ebook"||!m.used);
    if(pref&&pref!=="any") ms=[...ms.filter(m=>m.id===pref),...ms.filter(m=>m.id!==pref)];
    // Vrais liens vers la recherche du livre chez chaque libraire (pas de prix ni de stock inventés)
    const isbn=(b.isbn13||(String(b.id).startsWith("isbn-")?String(b.id).slice(5):""));
    const q=encodeURIComponent(isbn||`${b.title} ${b.author}`);
    const SHOPS=[
      ["Place des Libraires","Librairies indépendantes près de chez vous",`https://www.placedeslibraires.fr/listeliv.php?base=allbooks&mots_recherche=${q}`],
      ["Leslibraires.fr","Librairies indépendantes, en ligne",`https://www.leslibraires.fr/recherche/?q=${q}`],
      ["Decitre","Librairie en ligne",`https://www.decitre.fr/rechercher/result?q=${q}`],
      ["Fnac","Livraison ou retrait en magasin",`https://www.fnac.com/SearchResult/ResultList.aspx?Search=${q}`],
      ["Cultura","Livraison ou retrait en magasin",`https://www.cultura.com/search/results?search_query=${q}`],
      ["Amazon","Livraison à domicile",`https://www.amazon.fr/s?k=${q}&i=stripbooks`]];
    if(pref&&pref!=="any"){ const i=SHOPS.findIndex(s=>norm(s[0]).includes(norm(pref))); if(i>0) SHOPS.unshift(SHOPS.splice(i,1)[0]); }
    return `${navBar("")}<div class="scroll"><div class="pad">
      <span class="t-foot muted">${esc(b.title)} · ${esc(b.author)}</span>
      <h1 class="t-title2" style="margin:8px 0 16px">Où l'acheter</h1>
      ${b.future?`<div class="note">Ce livre n'est pas encore sorti. Ajoutez-le à vos envies pour le garder en tête.</div><button class="b b-primary b-block" style="margin-top:16px" data-a="wish" data-id="${b.id}" data-f="any">Ajouter à mes envies</button>`:`
      <div class="note">Le prix d'un livre neuf est le même partout en France. Choisissez simplement où vous préférez l'acheter.</div>
      <div style="margin-top:8px">${SHOPS.map(([n,info,u])=>`<a class="row" href="${u}" target="_blank" rel="noopener" style="padding:12px 0;border-bottom:.5px solid var(--hairline);text-decoration:none;color:inherit"><span style="display:flex;flex-direction:column;gap:4px"><span class="t-head">${n}</span><span class="t-foot muted">${info}</span></span>${ico("ext","chev")}</a>`).join("")}</div>
      <p class="t-foot muted" style="margin-top:16px;font-size:12px;line-height:16px">Chaque lien ouvre la recherche de ce livre sur le site du libraire.</p>`}
    </div><div style="height:40px"></div></div>`;
  },
  redirect(s){
    const m=s.m==="audio"?AUDIO_M:MERCHANTS.find(x=>x.id===s.m);
    setTimeout(()=>{ const t=T.stack[T.stack.length-1]; if(t&&t.v==="redirect"){ T.stack[T.stack.length-1]={v:"shop",id:s.id,m:s.m,f:s.f}; render(); } },1400);
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:40px;text-align:center"><div class="spinner" role="img" aria-label="Redirection"></div><p class="t-head">Ouverture de ${esc(m.name)}…</p><p class="t-sub muted">Vous quittez BookMatch. Redirection simulée.</p></div>`;
  },
  shop(s){
    const b=BY[s.id], m=s.m==="audio"?AUDIO_M:MERCHANTS.find(x=>x.id===s.m);
    return `<div class="merchant"><div style="padding:54px 16px 12px;background:#f2f2f2;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:8px;font:400 13px/18px var(--ui);color:#555"><button class="b b-text" data-a="leaveShop" style="color:#0a58ca;height:32px">${ico("back")}BookMatch</button><span style="flex:1;text-align:center">site-marchand-simule.demo</span></div>
      <div style="padding:20px;display:flex;flex-direction:column;gap:12px;flex:1"><span class="demo" style="align-self:flex-start">Page marchande simulée</span><p style="font:700 20px/26px var(--ui)">${esc(m.name)}</p>
      <div style="display:flex;gap:16px">${cover(b,90,13)}<div style="display:flex;flex-direction:column;gap:4px"><p style="font:600 17px/22px var(--ui)">${esc(b.title)}</p><p style="font:400 15px/20px var(--ui);color:#555">${esc(b.author)} · ${FMTL[s.f]}</p><p style="font:700 20px/26px var(--ui)">${price(b.ed[s.f].price)}</p></div></div>
      ${T.ordered?`<p style="font:600 15px/20px var(--ui);color:#1a7f37">Commande simulée. Aucun paiement n'a eu lieu.</p>`:`<button class="b" style="background:#111;color:#fff" data-a="order">Commander (simulation)</button>`}
      <p style="font:400 13px/18px var(--ui);color:#666;margin-top:auto">Cette page représente le site d'un marchand partenaire. Rien n'est réellement vendu.</p>
      <button class="b b-block" style="background:#eee;color:#111;margin-bottom:24px" data-a="leaveShop">Revenir à BookMatch</button></div></div>`;
  },
  scan(){
    const st=T.scan||"aim", fc=st==="ok"?"var(--accent)":st==="fail"?"var(--stone)":"var(--on-ink)", b=BY["vargas-neptune"];
    return `<div style="position:absolute;inset:0;background:#1E1D1B;color:var(--on-ink);display:flex;flex-direction:column">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:50px 16px 0"><button class="b b-text" data-a="pop" style="color:var(--on-ink)">Fermer</button><span class="t-head">Scanner</span><button class="iconbtn" style="color:var(--on-ink)" aria-label="Flash">${ico("flash")}</button></div>
      <p class="t-sub" style="text-align:center;margin:24px 0 16px" role="status">${st==="aim"?"Cadrez la couverture du livre":st==="busy"?"Analyse en cours…":st==="ok"?"Couverture reconnue":"Couverture non reconnue"}</p>
      <div class="scanframe" style="color:${fc}">${st==="fail"?`<div style="position:absolute;left:40px;top:50px;width:140px;height:210px;background:#3A3733;transform:rotate(9deg)"></div>`:`<div style="position:absolute;left:26px;top:30px;transform:rotate(${st==="aim"?-4:0}deg);opacity:${st==="aim"?.75:1}">${cover(b,168,25)}</div>`}<span class="c1"></span><span class="c2"></span><span class="c3"></span><span class="c4"></span></div>
      ${st==="aim"||st==="busy"?`<div style="margin-top:auto;padding-bottom:40px;display:flex;flex-direction:column;align-items:center;gap:20px">
        <div class="seg dark" role="tablist" style="width:240px"><button role="tab" aria-selected="true">Couverture</button><button role="tab" aria-selected="false" data-a="noop">Code-barres</button></div>
        ${st==="busy"?`<div class="spinner" style="border-color:rgba(245,243,238,.2);border-top-color:var(--on-ink);width:40px;height:40px"></div>`:`<button class="shutter" data-a="shoot" aria-label="Prendre la photo"><i></i></button>`}
        <div style="display:flex;gap:20px"><button class="b b-text" data-a="manual" style="color:#FBFAF7;text-decoration:underline;text-underline-offset:3px">Saisir le titre</button></div></div>`:""}
      ${st==="ok"?`<div class="sheet sheet-enter" style="color:var(--ink)"><div class="grabber"></div><div class="sheet-body" style="padding-top:16px;display:flex;flex-direction:column;gap:16px">
        <span class="t-foot" style="color:var(--success);font-weight:600">Livre identifié</span>
        <div style="display:grid;grid-template-columns:56px 1fr;gap:16px;align-items:center">${cover(b,56,9.5)}<div><p class="t-book-m">${esc(b.title)}</p><p class="t-sub muted">${esc(b.author)} · Poche · ${b.pages} p.</p></div></div>
        <button class="b b-primary b-block" data-a="confirmScan">C'est bien celui-ci</button>
        <div style="display:flex;justify-content:space-between"><button class="b b-text" data-a="rescan">Rescanner</button><button class="b b-text" data-a="manual">Autre édition</button></div></div></div>`:""}
      ${st==="fail"?`<div class="sheet sheet-enter" style="color:var(--ink)"><div class="grabber"></div><div class="sheet-body" style="padding-top:16px;display:flex;flex-direction:column;gap:12px">
        <h2 class="t-title2">Couverture non reconnue</h2><p class="t-sub muted">Évitez les reflets, tenez le livre à plat et en entier dans le cadre. Le code-barres au dos est plus fiable.</p>
        <button class="b b-primary b-block" data-a="rescan">Réessayer</button><button class="b b-ghost b-block" data-a="manual">Chercher par titre ou ISBN</button></div></div>`:""}
    </div>`;
  }
};

/* ---------- Feuilles modales ---------- */
const shead=(title,left,right)=>`<div class="grabber"></div><div class="sheet-head"><span style="justify-self:start">${left||`<button class="b b-text" data-a="closeSheet">Annuler</button>`}</span><span class="title">${title}</span><span style="justify-self:end">${right||""}</span></div>`;
const anim=()=>T.anim==="sheet"?"sheet-enter":"";
const prefFormat=b=>{ const f=S.prefs.formats.find(k=>!b||b.ed[k]); return f||"any"; };
const SHEETS={
  account(){
    const a=T.acc;
    const body=a.step==="email"
      ?`<p class="t-body">Recevez un code par e-mail pour retrouver votre profil et vos livres sur tous vos appareils. Pas de mot de passe.</p>
        <label class="field" style="margin-top:16px"><input id="accEmail" type="email" inputmode="email" autocomplete="email" placeholder="Votre adresse e-mail" value="${esc(a.email)}" aria-label="Adresse e-mail"></label>
        ${a.err?`<p class="t-foot" style="color:var(--danger);margin-top:8px">${esc(a.err)}</p>`:""}
        <button class="b b-primary b-block" style="margin-top:16px" data-a="accSend" ${a.busy?"disabled":""}>${a.busy?"Envoi…":"Recevoir un code"}</button>`
      :`<p class="t-body">Saisissez le code à 6 chiffres envoyé à <strong>${esc(a.email)}</strong>.</p>
        <label class="field" style="margin-top:16px"><input id="accCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456" value="${esc(a.code)}" aria-label="Code reçu par e-mail"></label>
        ${a.err?`<p class="t-foot" style="color:var(--danger);margin-top:8px">${esc(a.err)}</p>`:""}
        <button class="b b-primary b-block" style="margin-top:16px" data-a="accVerify" ${a.busy?"disabled":""}>${a.busy?"Vérification…":"Valider"}</button>
        <button class="b b-text b-block" style="margin-top:8px" data-a="accBack">Changer d'adresse ou renvoyer le code</button>`;
    return `<section class="sheet ${anim()}" role="dialog" aria-modal="true" aria-label="Sauvegarder mon profil">${shead("Sauvegarder mon profil")}<div class="pad" style="padding-bottom:32px">${body}</div></section>`;
  },
  add(){
    const q=T.addQ||"";
    return `<section class="sheet full ${anim()}" role="dialog" aria-modal="true" aria-label="Ajouter un livre">${shead("Ajouter un livre")}
      <div class="pad" style="display:flex;gap:8px"><label class="field">${ico("search")}<input id="addQ" type="search" placeholder="Titre, auteur ou ISBN" value="${esc(q)}" aria-label="Titre, auteur ou ISBN" autocomplete="off"></label><button class="iconbtn" data-a="scan" aria-label="Scanner une couverture" style="background:var(--sand);border-radius:10px;width:40px;height:40px">${ico("scan")}</button></div>
      <div class="sheet-body" id="addResults">${addResults(q)}</div></section>`;
  },
  confirm(s){
    const b=BY[s.id], st=T.draftStatus||"lu";
    const ch=[["lu","Lu","Puis donner mon avis"],["encours","En cours",""],["alire","À lire","Je l'ai déjà"],["envie","Envie","Je ne l'ai pas"]];
    return `<section class="sheet full ${anim()}" role="dialog" aria-modal="true" aria-label="Confirmer le livre">${shead("C'est bien celui-ci ?",`<button class="b b-text" data-a="${s.from==="scan"?"closeSheet":"backToAdd"}">Retour</button>`)}
      <div class="sheet-body" style="display:flex;flex-direction:column;gap:20px;flex:1">
        <div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px">${cover(b,120,18)}<p class="t-book" style="margin-top:12px">${esc(b.title)}</p><p class="t-sub muted">${esc(b.author)} · ${b.pages} p.</p></div>
        <div><h2 class="label" style="margin-bottom:12px">Où le ranger ?</h2><div role="radiogroup" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">${ch.map(([k,l,sub])=>`<button class="choice" role="radio" aria-checked="${st===k}" data-a="draftStatus" data-s="${k}">${l}${sub?`<small>${sub}</small>`:""}</button>`).join("")}</div></div>
        <button class="b b-primary b-block" style="margin-top:auto" data-a="confirmAdd" data-id="${b.id}">${st==="lu"?"Ajouter et donner mon avis":"Ajouter"}</button>
      </div></section>`;
  },
  eval(s){
    const b=BY[s.id], d=T.draft, ab=s.m==="abandon";
    const feel=[["pasaime","Pas aimé","close"],["neutre","Neutre","dash"],["aime","Apprécié","check"],["coeur","Adoré","heart"]];
    const showPos=!ab&&d.feeling&&d.feeling!=="pasaime", showNeg=ab||(d.feeling&&d.feeling!=="coeur");
    return `<section class="sheet full ${anim()}" role="dialog" aria-modal="true" aria-label="Votre avis sur ${esc(b.title)}">${shead(ab?"Abandon":"Votre avis",`<button class="b b-text" data-a="closeSheet">${ab?"Annuler":"Passer"}</button>`)}
      <div class="sheet-body" style="display:flex;flex-direction:column;gap:20px;flex:1">
        <div style="display:grid;grid-template-columns:56px 1fr;gap:16px;align-items:center">${cover(b,56,9.5)}<div><p class="t-book-m">${esc(b.title)}</p><p class="t-sub muted">${esc(b.author)}</p></div></div>
        ${ab?`<h2 class="t-head">Qu'est-ce qui vous a arrêté ?</h2>`:`<div class="feel" role="group" aria-label="Votre ressenti">${feel.map(([k,l,i])=>`<button aria-pressed="${d.feeling===k}" data-a="feel" data-f="${k}">${ico(i)}${l}</button>`).join("")}</div>
        ${d.feeling?`<div style="display:flex;align-items:center;justify-content:space-between"><span class="t-sub muted">Note (facultative)</span><span class="stars" role="radiogroup" aria-label="Note sur 5">${[1,2,3,4,5].map(n=>`<button role="radio" aria-checked="${d.stars===n}" aria-label="${n} étoile${n>1?"s":""}" data-a="stars" data-n="${n}" class="${(d.stars||0)>=n?"on":""}">${ico("star")}</button>`).join("")}</span></div>`:""}`}
        ${showPos?`<div><h2 class="label" style="margin-bottom:12px">Pourquoi l'avez-vous aimé ?</h2><div class="tags">${POS.map(([k,l])=>`<button class="tag ${d.pos.includes(k)?"on":""}" aria-pressed="${d.pos.includes(k)}" data-a="crit" data-k="${k}" data-t="pos">${l}</button>`).join("")}</div></div>`:""}
        ${showNeg?`<div>${ab?"":`<h2 class="label" style="margin-bottom:12px">${d.feeling==="pasaime"?"Pourquoi ne l'avez-vous pas aimé ?":"Ce qui vous a moins plu"}</h2>`}<div class="tags">${NEG.map(([k,l])=>`<button class="tag ${d.neg.includes(k)?"on":""}" aria-pressed="${d.neg.includes(k)}" data-a="crit" data-k="${k}" data-t="neg">${l}</button>`).join("")}</div></div>`:""}
        ${ab?`<label style="display:flex;align-items:center;justify-content:space-between" class="t-body">Arrêté vers la page<input id="pageIn" type="number" inputmode="numeric" value="${d.page||""}" style="width:90px;height:40px;border:0;border-radius:10px;background:var(--sand);text-align:center;font:inherit"></label>`:""}
        ${d.feeling||ab?`<label style="display:flex;flex-direction:column;gap:8px"><span class="label">Un mot ? (facultatif)</span><textarea id="comment" class="area" rows="2" placeholder="Ce que vous retiendrez de ce livre…">${esc(d.comment||"")}</textarea></label>`:`<p class="t-sub muted">Choisissez votre ressenti pour continuer, ou passez cette étape.</p>`}
        <button class="b b-primary b-block" style="margin-top:auto" data-a="saveEval" data-id="${b.id}" ${(d.feeling||ab)?"":"disabled"}>Enregistrer</button>
      </div></section>`;
  },
  learned(s){
    const b=BY[s.id];
    return `<section class="sheet full ${anim()}" role="dialog" aria-modal="true" aria-label="Ce que BookMatch a appris"><div class="grabber"></div>
      <div class="sheet-body" style="display:flex;flex-direction:column;gap:8px;flex:1;padding-top:32px">
        <span class="t-foot muted">${esc(b.title)} · ${s.label}</span>
        <h1 class="t-title2">${s.diff.length?`BookMatch a appris ${["","une chose","deux choses","trois choses"][s.diff.length]}`:"Avis enregistré"}</h1>
        <div style="margin-top:12px">${s.diff.length?s.diff.map(x=>`<div class="learn"><span style="display:flex;flex-direction:column;gap:4px"><span class="t-body">${x.u?`Univers : ${esc(x.u)}`:x.long?"Livres trop longs":featLabel(x.k,x.s)}</span><span class="d">${x.label}</span></span>${meterHtml(x.s,x.s<0)}</div>`).join(""):`<p class="t-sub muted">Ajoutez des raisons la prochaine fois : c'est ce qui affine le plus votre profil.</p>`}</div>
        ${s.diff.length?`<div class="ai sm" style="margin-top:16px">${AIMARK("Ce que ça change")}<p class="t-sub">${esc(s.sentence)}</p></div>`:""}
        <div style="margin-top:auto;display:flex;flex-direction:column;gap:8px"><button class="b b-primary b-block" data-a="seeProfile">Voir mon profil</button><button class="b b-text" data-a="closeSheet" style="align-self:center;color:var(--ink)">Terminer</button></div>
      </div></section>`;
  },
  wish(s){
    const b=BY[s.id], f=T.wf||s.f||prefFormat(b), al=T.walert!=null?T.walert:(f!=="any"&&!b.ed[f].avail);
    const fm=[["any","Peu importe"],["poche","Poche"],["gf","Grand format"],["ebook","Numérique"],["audio","Audio"]];
    return `<section class="sheet ${anim()}" role="dialog" aria-modal="true" aria-label="Ajouter aux envies">${shead("Ajouter aux envies","",`<button class="b b-text strong" data-a="confirmWish" data-id="${b.id}">OK</button>`)}
      <div class="sheet-body" style="display:flex;flex-direction:column;gap:16px">
        <div style="display:grid;grid-template-columns:56px 1fr;gap:16px;align-items:center">${cover(b,56,9.5)}<div><p class="t-book-m">${esc(b.title)}</p><p class="t-sub muted">${esc(b.author)}</p></div></div>
        <div><h2 class="label" style="margin-bottom:12px">Format souhaité</h2><div class="tags">${fm.map(([k,l])=>`<button class="tag ${f===k?"on":""}" aria-pressed="${f===k}" data-a="wf" data-f="${k}">${l}</button>`).join("")}</div>
        ${S.prefs.formats.length&&!T.wf&&!s.f?`<p class="t-foot muted" style="margin-top:8px">Présélectionné d'après vos préférences pratiques.</p>`:""}
        ${f!=="any"&&!b.ed[f].avail?`<p class="t-foot" style="margin-top:12px;color:var(--accent-ink)">${b.ed[f].date?`Sortie le ${fdate(b.ed[f].date)}. `:"Pas encore disponible dans ce format. "}Il ira dans « À attendre ».</p>`:""}</div>
        <div class="group"><div class="row" style="cursor:default"><span>Me prévenir à la sortie</span><button class="switch" role="switch" aria-checked="${al}" aria-label="Me prévenir à la sortie" data-a="walert"></button></div></div>
        <button class="b b-primary b-block" data-a="confirmWish" data-id="${b.id}" style="margin-bottom:12px">Ajouter</button>
      </div></section>`;

/* =========================================================
   6. ASSISTANT SCÉNARISÉ (intentions → humeurs et filtres)
   ========================================================= */
const INTENTS=[["suspense",/thriller|suspense|captivant|haletant/],["rire",/drole|rire|humour|cosy/],["romance",/romance|amour|romantique/],["legerete",/facile|leger|simple|detente/],["evasion",/evasion|sf|science-fiction|fantasy|voyage|imaginaire/],["reflechir",/reflechir|philo|essai|comprendre|apprendre/],["emotions",/emotion|pleurer|emouvant|touchant/],["decouverte",/changer|autre genre|sortir|decouvrir|nouveau/],["frisson",/peur|frisson|angoiss|horreur/],["inspiration",/inspir|motiv/]];
function assist(q,last){
  const n=norm(q), p=derive(); let pool, intro, intent="top";
  const base=()=>candidates(p,{allowRejected:false}).map(x=>x.b);
  const mentioned=BOOKS.find(b=>!b.future&&(n.includes(norm(b.title))||(lastName(b.author).length>3&&new RegExp("\\b"+norm(lastName(b.author))+"\\b").test(n))));
  if(last&&n.includes("moins sombre")){ pool=last.pool.filter(b=>(b.f.vi||0)<.3); intent=last.intent; intro="Plus doux, dans la même direction."; }
  else if(last&&n.includes("plus court")){ pool=last.pool.filter(b=>b.pages<=300); intent=last.intent; intro="Des livres de moins de 300 pages, à lire en quelques soirées."; }
  else if(last&&n.includes("autre chose")){ pool=last.pool.filter(b=>!last.books.includes(b.id)); intent=last.intent; intro="D'autres pistes dans la même direction."; }
  else if(mentioned||/meme esprit|comme |similaire/.test(n)){ intent="similaire";
    const ref=mentioned||BY[Object.entries(S.lib).find(([,e])=>e.feeling==="coeur")?.[0]||"vargas-pars"];
    pool=BOOKS.filter(b=>!b.future&&!S.lib[b.id]&&b.id!==ref.id).sort((a,b)=>sim(b,ref)-sim(a,ref));
    intro=`Dans l'esprit de ${ref.author} : ${join(Object.entries(ref.f).filter(([k,v])=>v>=.7&&!FEAT[k].bad).slice(0,2).map(([k])=>FEAT[k].phr))}.`; }
  else { const hit=INTENTS.find(([,re])=>re.test(n));
    if(hit){ intent=hit[0]; const m=hit[0];
      pool=BOOKS.filter(b=>!b.future&&!(b.ext&&!b.tagged)&&!S.lib[b.id]&&!S.hidden[b.id]&&(m==="decouverte"||!rejected(b))).map(b=>({b,s:moodScore(b,m)*.6+score(b,p).t*.4})).sort((a,c)=>c.s-a.s).map(x=>x.b);
      if(m==="suspense"&&/violent/.test(n)) pool=pool.filter(b=>(b.f.vi||0)<.5);
      if(/cosy/.test(n)) pool=pool.filter(b=>b.sub==="Cosy mystery").concat(pool.filter(b=>b.sub!=="Cosy mystery"));
      if(m==="decouverte") pool=pool.filter(b=>b.univ.every(u=>S.prefs.univ[u]!==1));
      intro=m==="suspense"&&/violent/.test(n)&&p.F.vi.s<0?"Vous aimez le suspense mais pas la violence graphique. Ici, la tension vient des personnages."
        :m==="decouverte"?`Hors de vos univers habituels, mais avec ${lists(p).want.length?FEAT[lists(p).want[0][0]].phr:"ce que vous recherchez"}.`
        :`Pour votre ${envieDe(MOODS[m].label)}, voici ce qui correspond le mieux à votre profil.`;
    } else { pool=base(); intro="Voici ce qui correspond le mieux à votre profil en ce moment."; } }
  const books=pool.slice(0,3).map(b=>b.id);
  if(!books.length) return {text:"Je n'ai rien trouvé avec ces critères dans le catalogue de démo. Essayez une autre formulation.",books:[],chips:["Quelque chose de facile à lire","J'ai envie de changer de genre"]};
  return {text:intro,books,chips:["Moins sombre","Plus court","Autre chose"],intent,pool};
}

/* =========================================================
   RECHERCHE INTELLIGENTE
   Une seule barre : titre, auteur, ou envie en langage naturel.
   - Titres et auteurs : correspondance directe
   - Envies : BookMatch interprète la phrase (même moteur que l'assistant) et propose 3 livres
   ========================================================= */

/* Interprétation d'une envie en langage naturel → critères lisibles + filtres */
function smartInterpret(q){
  const n=" "+norm(q)+" ", tags=[], filters=[];
  const UN={"polar":"Polar","policier":"Polar","enquete":"Polar","thriller":"Thriller","romance":"Romance","amour":"Romance","sf":"Science-fiction","science-fiction":"Science-fiction","science fiction":"Science-fiction",
    "fantasy":"Fantasy","fantastique":"Fantastique","classique":"Littérature classique","histoire":"Histoire","biographie":"Biographie","philo":"Philosophie","philosophie":"Philosophie",
    "psycho":"Psychologie","essai":"Essais","aventure":"Aventure","poesie":"Poésie","nouvelles":"Nouvelles","bd":"Littérature graphique","roman graphique":"Littérature graphique","feel good":"Fiction contemporaine"};
  const univ=[...new Set(Object.entries(UN).filter(([k])=>n.includes(" "+k)).map(([,u])=>u))];
  univ.forEach(u=>{ tags.push(u); filters.push(b=>b.univ.includes(u)); });
  if(/sans violence|pas violent|pas trop violent|doux|douceur|leger/.test(n)){ tags.push("Peu de violence"); filters.push(b=>(b.f.vi||0)<.35); }
  if(/court|rapide|vite lu|petit livre/.test(n)){ tags.push("Moins de 300 pages"); filters.push(b=>b.pages<=300); }
  if(/\blong|pave|epais/.test(n)){ tags.push("Plus de 450 pages"); filters.push(b=>b.pages>=450); }
  if(/drole|humour|rire|marrant/.test(n)){ tags.push("Avec de l'humour"); filters.push(b=>(b.f.hu||0)>=.5); }
  if(/emouvant|pleurer|touchant|emotion/.test(n)){ tags.push("Émouvant"); filters.push(b=>(b.f.em||0)>=.6); }
  if(/suspense|haletant|captivant|tension/.test(n)){ tags.push("Du suspense"); filters.push(b=>(b.f.su||0)>=.6); }
  if(/voyage|depaysant|ailleurs|evasion/.test(n)){ tags.push("Dépaysant"); filters.push(b=>(b.f.im||0)>=.6||b.univ.some(u=>["Aventure","Science-fiction","Fantasy"].includes(u))); }
  return {tags,filters};
}
const SEARCH_TRY=["Un polar sans violence","Comme Fred Vargas","Court et drôle","Une histoire qui fait voyager","Quelque chose de différent"];

      text=ids.length?"Voici les livres qui répondent à ces critères, classés selon votre profil.":"Aucun livre du catalogue de démo ne répond à tous ces critères."; }
    else { const r=assist(q,null); ids=r.books||[]; text=r.text; }
    if(ids.length||it.tags.length) html+=`<div class="ai" style="margin-top:20px">${AIMARK("BookMatch a compris")}
      ${it.tags.length?`<div class="tags" style="gap:6px">${it.tags.map(t=>`<span class="ai-tag">${esc(t)}</span>`).join("")}</div>`:""}
      <p class="t-body">${esc(text)}</p>
      ${ids.length?`<div class="ai-books">${ids.map(id=>bkRow(BY[id],null,BY[id].genre)).join("")}</div>`:""}</div>`; }
  if(authors.length) html+=`<h2 class="label" style="margin:24px 0 8px">Auteurs</h2><div class="group">${authors.map(a=>`<button class="row" data-a="sqAuthor" data-q="${esc(a)}"><span style="flex:1;text-align:left">${esc(a)}</span><span class="t-foot muted">${BOOKS.filter(b=>b.author===a).length} livre${BOOKS.filter(b=>b.author===a).length>1?"s":""}</span></button>`).join("")}</div>`;
  if(direct.length) html+=`<h2 class="label" style="margin:24px 0 8px">Titres</h2>${direct.map(b=>bkRow(b,null,b.genre)).join("")}`;
  if(!html) html=`<div class="empty" style="margin-top:32px"><p class="t-head">Aucun résultat</p><p class="t-sub muted" style="margin-top:4px">Essayez une envie (« un polar sans violence ») ou un auteur.</p></div>`;
  return html;
}

/* Menu déroulant de la recherche : 3 lignes maximum, sous la barre */
function smartMatches(q){
  const n=norm(q.trim()); if(n.length<2) return {ai:null,rows:[]};
  const rows=[];
  const authors=[...new Set(BOOKS.filter(b=>norm(b.author).includes(n)).map(b=>b.author))];
  authors.slice(0,1).forEach(a=>rows.push({k:"author",label:a,sub:"Auteur"}));
  BOOKS.filter(b=>!b.future&&!b.ext&&norm(b.title).includes(n)).slice(0,2).forEach(b=>rows.push({k:"book",id:b.id,label:b.title,sub:b.author}));
  remoteIds(q).map(id=>BY[id]).filter(b=>b&&!rows.some(r=>r.id===b.id)).slice(0,4).forEach(b=>rows.push({k:"book",id:b.id,label:b.title,sub:b.author}));
  let ai=null;
  if(n.length>=3){ const it=smartInterpret(q), p=derive();

      if(ids.length) ai={label:it.tags.join(" · "),ids}; }
    else if(authors.length){ const r=assist("comme "+authors[0],null); if(r.books&&r.books.length) ai={label:"Dans l'esprit de "+authors[0],ids:r.pool?r.pool.slice(0,8).map(b=>b.id):r.books}; } }
  return {ai,rows:rows.slice(0,ai?5:6)};
}

/* =========================================================
   INTELLIGENCE : Claude rédige les « Pourquoi ce livre » et répond dans l'assistant
   (capacité « sample » de l'artefact : pas de serveur, pas de clé API).
   Si l'IA n'est pas disponible, l'app garde ses textes calculés par règles.
   ========================================================= */
let AI=null;                 // l'accès à Claude, ou null si indisponible
const AIW={};                // cache des explications : clé (livre + profil) → texte | "pending" | "error"
(async()=>{ try{ AI=window.claude&&window.claude.use?await window.claude.use("sample"):null; }catch(e){ AI=null; } if(AI) render(); })();

// Résumé du profil du lecteur, envoyé à l'IA (elle n'a pas de mémoire)
function profileDigest(p){
  const P=S.prefs, {want,avoid}=lists(p), posL=Object.fromEntries(POS.map(x=>[x[0],x[1]])), negL=Object.fromEntries(NEG.map(x=>[x[0],x[1]]));
  const lines=[];
  const ul=Object.keys(P.univ).filter(u=>P.univ[u]===1), ur=Object.keys(P.univ).filter(u=>P.univ[u]===-1);
  if(ul.length) lines.push("Univers aimés : "+ul.join(", "));
  if(ur.length) lines.push("Univers écartés : "+ur.join(", "));
  if(P.sub.length) lines.push("Sous-genres aimés : "+P.sub.join(", "));
  if(P.authors.length) lines.push("Auteurs favoris : "+P.authors.join(", "));
  const lib=Object.entries(S.lib).filter(([id,e])=>BY[id]&&e.feeling).slice(0,12).map(([id,e])=>{
    const b=BY[id]; let s=`« ${b.title} » (${b.author}) : ${FEEL[e.feeling].label.toLowerCase()}`;
    if((e.pos||[]).length) s+=` ; a aimé : ${e.pos.map(k=>posL[k]||k).join(", ").toLowerCase()}`;
    if((e.neg||[]).length) s+=` ; a moins aimé : ${e.neg.map(k=>negL[k]||k).join(", ").toLowerCase()}`;
    return "- "+s; });
  if(lib.length) lines.push("Livres lus :\n"+lib.join("\n"));
  if(want.length) lines.push("Recherche : "+want.slice(0,5).map(([k])=>FEAT[k].phr).join(", "));
  if(avoid.length) lines.push("Évite : "+avoid.slice(0,4).map(([k])=>FEAT[k].nphr).join(", "));
  if(T.mood) lines.push("Humeur du moment : "+MOODS[T.mood].label.toLowerCase());
  return lines.join("\n")||"Profil encore vide.";
}
const bookCard=b=>`« ${b.title} » de ${b.author} (${b.genre}, ${yearTxt(b.year)}, ${b.pages} p.). Résumé : ${b.sum} Points forts : ${Object.entries(b.f).filter(([k,v])=>v>=.6&&!FEAT[k].bad).map(([k])=>FEAT[k].phr).join(", ")}.`;

// Demande à l'IA le « Pourquoi ce livre » d'un livre ; l'écran se met à jour quand le texte arrive
function aiWhy(b,p){
  if(!AI) return null;
  const digest=profileDigest(p), key=b.id+"|"+hash(digest);
  const v=AIW[key];
  if(typeof v==="string"&&v!=="pending"&&v!=="error") return v;
  if(v) return null;
  AIW[key]="pending";
  const prompt=`Vous êtes BookMatch, une libraire qui connaît bien ses lecteurs.
Écrivez en français, en vouvoyant le lecteur, pourquoi ce livre lui correspond.
Règles : 2 phrases, 45 mots maximum. Appuyez-vous uniquement sur le profil et la fiche ci-dessous, sans rien inventer sur le livre. Reliez le livre à ce que le lecteur a aimé (vous pouvez citer un de ses livres entre « »). Pas d'introduction, pas d'emoji, pas de point d'exclamation, pas de note sur 10. Répondez uniquement par les 2 phrases.

LIVRE
${bookCard(b)}

PROFIL DU LECTEUR
${digest}`;
  AI(prompt,{modelTier:"quick",cache:true}).then(r=>{
    const t=(r&&r.text||"").trim().replace(/^["«\s]+|["»\s]+$/g,"");
    AIW[key]=t&&t.length<500?t:"error"; render();
  }).catch(e=>{ AIW[key]="error"; if(e&&e.code==="not_granted") AI=null; });
  return null;
}
// Texte à afficher : celui de l'IA s'il est prêt, sinon celui calculé par règles
const whyShown=(b,p,w)=>aiWhy(b,p)||w.text;

// Assistant : l'IA choisit dans le catalogue et explique
async function aiAssist(q){
  const p=derive();
  const pool=candidates(p,{allowRejected:true}).slice(0,120).map(x=>x.b);
  const cat=pool.map(b=>`${b.id} | ${b.title} | ${b.author} | ${b.genre} | ${b.pages} p. | ${Object.entries(b.f).filter(([,v])=>v>=.6).map(([k])=>FEAT[k].pos).join(", ")}`).join("\n");
  const lib=Object.entries(S.lib).map(([id,e])=>`${id} (${STATUS[e.status]||e.status})`).join(", ")||"aucun";
  const hist=T.chat.slice(-7,-1).map(m=>(m.me?"Lecteur : ":"BookMatch : ")+m.text).join("\n");
  const prompt=`Vous êtes BookMatch, l'assistant de lecture d'une app française. Vous vouvoyez, écrivez court et chaleureux, sans emoji ni point d'exclamation.
Recommandez UNIQUEMENT des livres du CATALOGUE ci-dessous (par leur identifiant), jamais d'autres. Évitez ceux déjà dans la bibliothèque, sauf si le lecteur en parle.
Répondez en JSON strict : {"text": "2 à 3 phrases qui répondent et expliquent le choix au regard du profil", "ids": ["jusqu'à 4 identifiants du catalogue, du plus pertinent au moins pertinent"], "chips": ["2 ou 3 relances courtes que le lecteur pourrait taper ensuite"]}
Si la demande ne concerne pas la lecture, répondez poliment dans "text" avec "ids": [].

PROFIL DU LECTEUR
${profileDigest(p)}
Bibliothèque : ${lib}

CATALOGUE (id | titre | auteur | genre | pages | points forts)
${cat}

CONVERSATION
${hist}
Lecteur : ${q}`;
  const r=await AI(prompt,{modelTier:"default",cache:false});
  const raw=(r&&r.text||"").replace(/^```(json)?|```$/g,"").trim();
  const o=JSON.parse(raw.slice(raw.indexOf("{"),raw.lastIndexOf("}")+1));
  const ids=(o.ids||[]).filter(id=>BY[id]&&!BY[id].future).slice(0,4);
  return {text:String(o.text||"").trim()||"Voici quelques pistes.",books:ids,chips:(o.chips||[]).slice(0,3).map(String),pool:ids.map(id=>BY[id]),intent:"ai"};
}
function ask(q){
  if(!q.trim()) return;
  const last=[...T.chat].reverse().find(m=>!m.me&&m.pool);
  T.chat.push({me:true,text:q}); T.thinking=true; render(); scrollChat();
  // Avec l'IA : vraie réponse ; sans IA (ou en cas d'erreur) : réponse calculée par règles
  if(AI){ aiAssist(q).then(m=>{ T.thinking=false; T.chat.push(m); render(); scrollChat(); })
    .catch(e=>{ if(e&&e.code==="not_granted") AI=null; T.thinking=false; T.chat.push(assist(q,last)); render(); scrollChat(); }); return; }
  setTimeout(()=>{ T.thinking=false; T.chat.push(assist(q,last)); render(); scrollChat(); },1100);
}

function profileDiff(a,b){
  const out=[];
  for(const k of Object.keys(FEAT)){ const d=b.F[k].s-a.F[k].s; if(Math.abs(d)>=.4) out.push({k,s:b.F[k].s,d,lab:Math.abs(a.F[k].s)<.5?"Nouveau":(d>0)===(b.F[k].s>0)?"Renforcé":"Nuancé"}); }
  for(const u of new Set([...Object.keys(a.LU),...Object.keys(b.LU)])){ const d=(b.LU[u]||0)-(a.LU[u]||0); if(Math.abs(d)>=.4) out.push({u,s:(b.LU[u]||0)*2,d,lab:d>0?"Plus apprécié":"Moins apprécié"}); }
  if(b.short-a.short>=.4) out.push({long:true,s:-b.short*1.5,d:b.short-a.short,lab:a.short<.4?"Nouveau":"Renforcé"});
  return out.sort((x,y)=>Math.abs(y.d)-Math.abs(x.d)).slice(0,3).map(x=>({k:x.k,u:x.u,long:x.long,s:x.s,label:x.lab}));
}
function learnedSentence(b,diff,feeling){
  const plus=diff.filter(x=>x.k&&x.s>0&&!FEAT[x.k].bad).map(x=>FEAT[x.k].phr), minus=diff.filter(x=>x.k&&x.s<0).map(x=>FEAT[x.k].nphr).concat(diff.some(x=>x.long)?["les livres trop longs"]:[]);
  let s=`${FEEL[feeling].label} pour ${lastName(b.author)}.`;
  if(plus.length) s+=` Je chercherai ${join(plus)}`;
  if(minus.length) s+=`${plus.length?", en évitant":" J'éviterai"} ${join(minus)}`;
  return s+(plus.length||minus.length?".":"");
}

<script>
/* =========================================================
   PISTE E · COUCHE DE MOUVEMENT (principes « design fluide » d'Apple)
   Ne change aucun parcours : on enveloppe render(), pop() et closeSheet().
   ========================================================= */
(()=>{
const RM=matchMedia('(prefers-reduced-motion: reduce)');
// Ressort interruptible : damping (1 = sans rebond) + response (rapidité en s)
function spring(from,to,{damping=1,response=.38,velocity=0}={},onUpdate,done){
  let x=from,v=velocity,last=performance.now(),raf;
  if(RM.matches){ onUpdate(to); done&&done(); return {stop(){}}; }
  const k=(2*Math.PI/response)**2, c=4*Math.PI*damping/response;
  const tick=now=>{ const dt=Math.min((now-last)/1000,1/30); last=now;
    for(let i=0;i<4;i++){ const h=dt/4; v+=(-k*(x-to)-c*v)*h; x+=v*h; }
    onUpdate(x);
    if(Math.abs(x-to)<.3&&Math.abs(v)<4){ onUpdate(to); done&&done(); return; }
    raf=requestAnimationFrame(tick); };
  raf=requestAnimationFrame(tick);
  return {stop(){cancelAnimationFrame(raf)}};
}
const project=(v,d=.998)=>(v/1000)*d/(1-d);                    // où l'élan « veut » aller
const rubber=(o,dim,c=.55)=>(o*dim*c)/(dim+c*Math.abs(o));     // résistance au-delà d'une limite
function tracker(){ const h=[]; return { add(p){ const t=performance.now(); h.push({p,t}); while(h.length&&t-h[0].t>100) h.shift(); },
  vel(){ if(h.length<2) return 0; const a=h[0],b=h[h.length-1],dt=(b.t-a.t)/1000; return dt>0?(b.p-a.p)/dt:0; } }; }

const W=()=>phone.clientWidth, H=()=>phone.clientHeight;
let busy=false;

/* --- Écran poussé : l'écran du dessous recule de 30 % et s'assombrit légèrement --- */
function layers(){ const ls=[...phone.querySelectorAll(':scope > .layer')]; return {top:ls[ls.length-1], under:ls[ls.length-2]}; }
function setPush(top,under,x){ const p=1-x/W(); top.style.transform=`translateX(${x}px)`;
  if(under){ under.style.transform=`translateX(${-p*W()*.3}px)`; under.style.filter=`brightness(${1-.06*p})`; } }

/* --- Feuille : l'arrière-plan recule (échelle + coins arrondis) --- */
function setSheet(sh,scrim,y){ const h=sh.offsetHeight, p=Math.max(0,Math.min(1,1-y/h));
  sh.style.transform=`translateY(${y}px)`; if(scrim) scrim.style.opacity=p;
  const {top}=layers(); if(top){ top.style.scale=String(1-.04*p); top.style.borderRadius=`${36*p}px`; top.style.overflow='hidden'; } }

/* --- Enveloppe de render() : anime ce qui vient d'apparaître et branche les gestes --- */
const _render=window.render;
window.render=function(){
  const anim=T.anim; _render();
  const {top,under}=layers();
  if(T.stack&&T.stack.length&&top&&top.classList.contains('pushed')){
    if(anim==='push'){ setPush(top,under,W()); spring(W(),0,{response:.38},x=>setPush(top,under,x)); }
    else setPush(top,under,0);
    bindEdgeSwipe(top,under);
  }
  const sh=phone.querySelector('.sheet'), scrim=phone.querySelector('.scrim');
  if(sh){ if(anim==='sheet'){ const h=sh.offsetHeight; setSheet(sh,scrim,h); spring(h,0,{damping:.85,response:.32},y=>setSheet(sh,scrim,y)); }
    else setSheet(sh,scrim,0);
    bindSheetDrag(sh,scrim); }
};

/* --- Retour : même chemin qu'à l'aller (vers la droite) --- */
function animatedPop(v=0){ const {top,under}=layers(); if(busy||!top||!top.classList.contains('pushed')) return _pop();
  busy=true; const x0=parseFloat((top.style.transform.match(/-?[\d.]+/)||[0])[0])||0;
  spring(x0,W(),{response:.34,velocity:v},x=>setPush(top,under,x),()=>{ busy=false; _pop(); }); }
const _pop=window.pop; window.pop=()=>animatedPop(); A.pop=()=>animatedPop();

/* --- Fermer une feuille : elle redescend, en gardant la vitesse du doigt --- */
function animatedClose(v=0){ const sh=phone.querySelector('.sheet'), scrim=phone.querySelector('.scrim');
  if(busy||!sh) return _closeA();
  // Retour de la feuille « envie » vers l'assistant : pas d'animation de sortie
  if(T.prevSheet==='assistant'&&T.sheet&&T.sheet.v==='wish') return _closeA();
  busy=true; const y0=parseFloat((sh.style.transform.match(/-?[\d.]+/)||[0])[0])||0;
  spring(y0,sh.offsetHeight+20,{response:.3,velocity:v},y=>setSheet(sh,scrim,y),()=>{ busy=false; _closeA(); }); }
const _closeA=A.closeSheet; A.closeSheet=()=>animatedClose();

/* --- Geste : tirer depuis le bord gauche pour revenir (suivi 1:1, élan projeté) --- */
function bindEdgeSwipe(top,under){
  const tr=tracker(); let st=null, mode=null;
  top.addEventListener('pointerdown',e=>{ if(busy) return; const r=phone.getBoundingClientRect(); if(e.clientX-r.left>32) return;
    st={x:e.clientX,y:e.clientY}; mode=null; },{passive:true});
  top.addEventListener('pointermove',e=>{ if(!st) return; const dx=e.clientX-st.x, dy=e.clientY-st.y;
    if(!mode){ if(dx>10&&dx>Math.abs(dy)){ mode='x'; top.setPointerCapture(e.pointerId); } else if(Math.abs(dy)>10){ st=null; return; } }
    if(mode==='x'){ tr.add(e.clientX); setPush(top,under,Math.max(0,dx)); } });
  const up=e=>{ if(!st) return; const s=st; st=null; if(mode!=='x') return;
    const x=Math.max(0,e.clientX-s.x), v=tr.vel();
    if(x+project(v)>W()/2) animatedPop(v); else spring(x,0,{response:.34,velocity:v},xx=>setPush(top,under,xx)); };
  top.addEventListener('pointerup',up); top.addEventListener('pointercancel',up);
}

/* --- Geste : attraper la feuille par le haut, élastique vers le haut, fermeture selon l'élan --- */
function bindSheetDrag(sh,scrim){
  const tr=tracker(); let st=null, drag=false;
  sh.addEventListener('pointerdown',e=>{ if(busy) return;
    const body=sh.querySelector('.sheet-body'); const inHead=e.clientY-sh.getBoundingClientRect().top<64;
    if(!inHead&&body&&body.scrollTop>0) return;            // si le contenu défile, on le laisse défiler
    if(e.target.closest('input,textarea')) return;
    st=e.clientY; drag=false; tr.add(e.clientY); });
  sh.addEventListener('pointermove',e=>{ if(st===null) return; const dy=e.clientY-st;
    if(!drag){ if(Math.abs(dy)<10) return; drag=true; sh.setPointerCapture(e.pointerId); }
    tr.add(e.clientY); setSheet(sh,scrim,dy<0?rubber(dy,H()):dy); });
  const up=e=>{ if(st===null) return; const dy=e.clientY-st; st=null; if(!drag) return;
    const v=tr.vel(), y=dy<0?rubber(dy,H()):dy;
    if(y+project(v)>sh.offsetHeight*.4) animatedClose(v); else spring(y,0,{damping:.8,response:.3,velocity:v},yy=>setSheet(sh,scrim,yy)); };
  sh.addEventListener('pointerup',up); sh.addEventListener('pointercancel',up);
  // Un glissement ne doit pas déclencher de clic sur un bouton de la feuille
  sh.addEventListener('click',e=>{ if(drag){ e.stopPropagation(); e.preventDefault(); drag=false; } },true);
}
})();

</script>

<script>
/* ---------- Bibliothèque : défilement des puces + glisser le contenu pour changer de statut ---------- */
(()=>{
  const ORDER=["encours","lu","alire","abandon"];
  // Après chaque rendu : garder la puce choisie visible dans la rangée
  const _r=window.render;
  window.render=function(){ _r(); const sel=phone.querySelector('.seg-scroll [aria-selected="true"]');
    if(sel){ const row=sel.parentElement; const x=sel.offsetLeft-20; if(x<row.scrollLeft||sel.offsetLeft+sel.offsetWidth>row.scrollLeft+row.clientWidth) row.scrollLeft=Math.max(0,x); } };
  // Glisser le contenu : suit le doigt (avec résistance), change de statut si le geste est assez long ou rapide
  let st=null;
  phone.addEventListener('pointerdown',e=>{ const z=e.target.closest('.lib-swipe'); if(!z) return; st={x:e.clientX,y:e.clientY,t:performance.now(),z,mode:null}; },{passive:true});
  phone.addEventListener('pointermove',e=>{ if(!st) return; const dx=e.clientX-st.x, dy=e.clientY-st.y;
    if(!st.mode){ if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.2) st.mode='x'; else if(Math.abs(dy)>10){ st=null; return; } else return; }
    const i=ORDER.indexOf(T.libSeg), edge=(dx>0&&i===0)||(dx<0&&i===ORDER.length-1);
    st.z.style.transform=`translateX(${edge?dx*.25:dx*.6}px)`; st.z.style.opacity=String(1-Math.min(Math.abs(dx)/600,.35)); },{passive:true});
  const end=e=>{ if(!st) return; const s0=st; st=null; if(s0.mode!=='x') return;
    const dx=e.clientX-s0.x, v=dx/Math.max(1,performance.now()-s0.t)*1000, i=ORDER.indexOf(T.libSeg);
    const go=(Math.abs(dx)>70||Math.abs(v)>500)?(dx<0?1:-1):0, j=i+go;
    s0.z.style.transition='transform .25s ease, opacity .25s ease'; s0.z.style.transform=''; s0.z.style.opacity='';
    if(go&&j>=0&&j<ORDER.length){ T.libSeg=ORDER[j]; render(); try{navigator.vibrate&&navigator.vibrate(6)}catch(_){} } };
  phone.addEventListener('pointerup',end); phone.addEventListener('pointercancel',end);
})();
</script>

      if(!st.mode){ if(Math.abs(dx)<10&&Math.abs(dy)<10) return; st.mode='x'; }
      const t=performance.now(); hist.push({x:e.clientX,t}); while(hist.length>2&&t-hist[0].t>100) hist.shift();
      setX(card,dx); });
    const up=e=>{ if(!st) return; const s0=st; st=null; if(!s0.mode) return;
      const dx=e.clientX-s0.x, a=hist[0], b=hist[hist.length-1], v=(b.t-a.t)>0?(b.x-a.x)/((b.t-a.t)/1000):0, land=dx+project(v), W=card.offsetWidth;
      if(Math.abs(land)>W*.45) fly(card,Math.sign(land),v);
      else spring(dx,0,{damping:.75,response:.35,velocity:v},x=>setX(card,x)); };
    card.addEventListener('pointerup',up); card.addEventListener('pointercancel',up);
    card.addEventListener('keydown',e=>{ if(e.key==='ArrowRight') window.uFly(1); if(e.key==='ArrowLeft') window.uFly(-1); });
  };
})();

// Points du carrousel : on met à jour le point actif quand la piste défile
document.addEventListener("scroll",e=>{ const t=e.target; if(!t.matches||!t.matches("[data-rc]")) return;
  const card=t.querySelector(".rc-card"); if(!card) return; const step=card.getBoundingClientRect().width+14;
  const n=Math.round(t.scrollLeft/step); t.parentElement.querySelectorAll(".rc-dots i").forEach((d,i)=>d.classList.toggle("on",i===Math.min(n,t.parentElement.querySelectorAll(".rc-dots i").length-1))); },true);

/* Mode app (écran d'accueil) + mise en cache hors connexion */
try{ if(window.matchMedia("(display-mode: standalone)").matches) document.documentElement.classList.add("pwa"); if(navigator.standalone) document.documentElement.classList.add("pwa-ios"); }catch(e){}
if("serviceWorker" in navigator && location.protocol==="https:") window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
