<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BookMatch">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="apple-touch-icon" href="icons/apple-touch-icon-v4.png">
<link rel="icon" type="image/svg+xml" href="icons/favicon-v4.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32-v4.png">
<title>BOOKMATCH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=EB+Garamond:wght@400;500&display=swap">
<style>
/* =========================================================
   BOOKMATCH — Prototype interactif (Phase 4, DA V2)
   Tokens repris du design system BOOKMATCH
   ========================================================= */
:root{
  --paper:#F5F3EE; --raised:#FBFAF7; --sand:#E5E0D6; --kraft:#D9CFBE; --hairline:#DCD6CB;
  --ink:#242321; --on-ink:#F5F3EE; --stone:#858078; --stone-text:#625D56;
  --accent:#D8A35D; --accent-ink:#8A5A1F; --accent-soft:#F1E2CB; --success:#3F6B4A; --danger:#A33A2B;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Inter,system-ui,sans-serif;
  --serif:Newsreader,"Iowan Old Style",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#E9E6DF;color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
p,h1,h2,h3{margin:0}

/* ---------- Scène : téléphone + panneau de test ---------- */
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:48px;padding:32px}
.phone{position:relative;width:390px;height:844px;border-radius:52px;background:var(--paper);overflow:hidden;
  box-shadow:0 0 0 10px #1c1b19,0 0 0 11px #3a3833,0 30px 80px rgba(0,0,0,.25);flex:none}
.side{width:300px;font-size:14px;line-height:20px;color:var(--stone-text)}
.side h2{font:600 15px/20px var(--ui);color:var(--ink);margin:0 0 8px}
.side ol{padding-left:16px;margin:8px 0 16px}
.side li{margin-bottom:8px}
.side button{appearance:none;border:1px solid var(--stone);background:transparent;border-radius:10px;padding:8px 12px;cursor:pointer;color:var(--ink)}
@media (max-width:820px){
  .stage{padding:0;display:block}
  .side{display:none}
  .phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}
}

/* ---------- Couches d'écran ---------- */
.layer{position:absolute;inset:0;background:var(--paper);display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.pad{padding:0 20px}
.top{padding-top:56px}
.push-enter{animation:pushIn .3s cubic-bezier(.2,.8,.2,1)}
@keyframes pushIn{from{transform:translateX(100%)}to{transform:none}}
.fade-enter{animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.scrim{position:absolute;inset:0;background:rgba(36,35,33,.32);z-index:9}
.layer.pushed{z-index:6}
.scrim.fade-enter{animation:fadeIn .25s ease}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:calc(100% - 54px);background:var(--raised);border-radius:22px 22px 0 0;
  display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(36,35,33,.12);z-index:10}
.sheet.full{top:54px}
.sheet.dark{background:#1E1D1B;color:var(--on-ink)}
.sheet-enter{animation:sheetIn .35s cubic-bezier(.2,.8,.2,1)}
@keyframes sheetIn{from{transform:translateY(100%)}to{transform:none}}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--stone);margin:8px auto 0;flex:none}
.sheet-head{display:grid;grid-template-columns:90px 1fr 90px;align-items:center;height:48px;padding:0 16px;flex:none}
.sheet-head .title{text-align:center;font:600 17px/22px var(--ui)}
.sheet-body{padding:4px 20px 24px;overflow-y:auto}
@media (prefers-reduced-motion:reduce){.push-enter,.sheet-enter,.fade-enter{animation:none}}

/* ---------- Typo ---------- */
.t-large{font:700 34px/41px var(--ui);letter-spacing:.01em}
.t-title2{font:700 22px/28px var(--ui)}
.t-title3{font:600 20px/25px var(--ui)}
.t-head{font:600 17px/22px var(--ui)}
.t-body{font:400 17px/23px var(--ui)}
.t-sub{font:400 15px/20px var(--ui)}
.t-foot{font:400 13px/18px var(--ui)}
.t-book{font:500 26px/30px var(--serif);letter-spacing:-.01em}
.t-book-m{font:500 20px/24px var(--serif)}
.muted{color:var(--stone-text)}
.label{font:600 13px/18px var(--ui);color:var(--stone-text);text-transform:uppercase;letter-spacing:.02em}

/* ---------- Boutons ---------- */
.b{appearance:none;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 20px;border-radius:12px;font:600 17px/22px var(--ui);text-decoration:none;transition:transform .12s}
.b:active{transform:scale(.98)}
.b:focus-visible,.tag:focus-visible,.tab:focus-visible,.row:focus-visible,.bk:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.b-primary{background:var(--ink);color:var(--on-ink)}
.b-ghost{background:var(--sand);color:var(--ink)}
.b-line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.b-text{background:none;color:var(--accent-ink);height:44px;padding:0 4px;font-weight:400}
.b-text.strong{font-weight:600}
.b-block{width:100%}
.b-icon{width:50px;padding:0}
.b[disabled]{background:var(--sand);color:var(--stone-text);cursor:not-allowed}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.iconbtn{appearance:none;border:0;background:none;width:44px;height:44px;display:grid;place-items:center;cursor:pointer;color:var(--ink);border-radius:50%}
.back{appearance:none;border:0;background:none;display:flex;align-items:center;gap:4px;height:44px;padding:0 8px 0 0;color:var(--accent-ink);font:400 17px/22px var(--ui);cursor:pointer}

/* ---------- Champs ---------- */
.field{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:10px;background:var(--sand);color:var(--stone-text);font:400 17px/22px var(--ui);border:0;width:100%;cursor:text;text-align:left}
.field input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--ink);outline:none}
.field input::placeholder{color:var(--stone-text)}
.field:focus-within{box-shadow:0 0 0 2px var(--ink)}
textarea.area{width:100%;border:0;border-radius:10px;background:var(--sand);padding:12px;font:400 17px/23px var(--ui);color:var(--ink);resize:none;outline:none}
textarea.area:focus{box-shadow:0 0 0 2px var(--ink)}

/* ---------- Contrôle segmenté ---------- */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:4px;border-radius:9px;background:var(--sand)}
.seg button{appearance:none;border:0;height:30px;border-radius:7px;background:transparent;font:500 13px/18px var(--ui);color:var(--ink);cursor:pointer;white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--raised);box-shadow:0 1px 3px rgba(36,35,33,.14);font-weight:600}
.seg.dark{background:rgba(245,243,238,.14)}
.seg.dark button{color:var(--on-ink)}
.seg.dark button[aria-selected="true"]{background:var(--on-ink);color:var(--ink)}

/* ---------- Chips ---------- */
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags.line{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.tags.line::-webkit-scrollbar{display:none}
.tag{appearance:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:18px;background:var(--sand);border:1px solid transparent;font:500 15px/20px var(--ui);color:var(--ink);white-space:nowrap;flex:none;transition:transform .12s}
.tag:active{transform:scale(.96)}
.tag.on{background:var(--ink);color:var(--on-ink)}
.tag.off{background:transparent;border:1px dashed var(--stone-text);color:var(--stone-text);text-decoration:line-through}
.tag svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}

/* ---------- Listes groupées ---------- */
.group{background:var(--raised);border-radius:12px;overflow:hidden}
.row{appearance:none;border:0;background:none;width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;padding:0 16px;font:400 17px/22px var(--ui);color:var(--ink);text-align:left;cursor:pointer;border-bottom:.5px solid var(--hairline)}
.row:last-child{border-bottom:0}
.row .r{display:flex;align-items:center;gap:8px;color:var(--stone-text)}
.chev{width:14px;height:14px;fill:none;stroke:var(--stone);stroke-width:2;flex:none}
.group-title{margin:24px 0 8px 16px}

/* ---------- Barre d'onglets ---------- */
.dock{position:absolute;left:0;right:0;bottom:22px;display:flex;justify-content:center;align-items:center;gap:8px;z-index:5}
.tabbar{display:flex;align-items:center;height:62px;padding:0 8px;background:var(--raised);border-radius:31px;box-shadow:0 1px 0 rgba(36,35,33,.05),0 8px 24px rgba(36,35,33,.12)}
.tab{appearance:none;border:0;background:transparent;cursor:pointer;min-width:58px;padding:0 12px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:26px;color:var(--stone-text);font:500 10px/12px var(--ui);white-space:nowrap}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--ink);background:var(--sand)}
.add{appearance:none;border:0;cursor:pointer;flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--on-ink);box-shadow:0 8px 24px rgba(36,35,33,.2)}
.add svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.fadebar{position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(rgba(245,243,238,0),var(--paper) 62%);pointer-events:none;z-index:4}
.tabspace{height:120px}

/* ---------- Couvertures générées ---------- */
.cv{position:relative;flex:none;aspect-ratio:2/3;border-radius:2px 3px 3px 2px;overflow:hidden;color:#F5F3EE;
  box-shadow:0 1px 1px rgba(36,35,33,.15),0 6px 16px rgba(36,35,33,.14)}
.cv::after{content:"";position:absolute;inset:0 auto 0 0;width:5%;background:linear-gradient(90deg,rgba(0,0,0,.18),rgba(255,255,255,.06))}
.cv .au{font:600 .6em/1.2 var(--ui);letter-spacing:.08em;text-transform:uppercase;color:inherit}
.cv .ti{color:inherit;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden;overflow-wrap:normal;word-break:normal;hyphens:manual}
.cv.long .ti{-webkit-line-clamp:5}
.cv-a{display:flex;flex-direction:column;justify-content:space-between;padding:.7em .7em .8em .9em}
.cv-a .ti{font:400 1.25em/1.04 var(--serif);letter-spacing:-.02em}
.cv-a.long .ti{font-size:.95em}
.cv-b{display:flex;align-items:center;justify-content:center}
.cv-b .fr{position:absolute;inset:.45em;border:1px solid currentColor;opacity:.55}
.cv-b .in{text-align:center;display:flex;flex-direction:column;gap:.5em;padding:0 .9em}
.cv-b .ti{font:italic 400 1.15em/1.08 var(--serif)}
.cv-b.long .ti{font-size:.9em}
.cv-c{display:grid;grid-template-rows:50% 50%}
.cv-c .tp{display:flex;align-items:flex-end;padding:.6em .7em .6em .9em}
.cv-c .band{background:#F1ECE2;color:#242321;padding:.5em .6em .5em .85em;display:flex;flex-direction:column;justify-content:space-between;gap:.3em;min-height:0;overflow:hidden}
.cv-c .ti{font:500 .92em/1.08 var(--serif);-webkit-line-clamp:3}
.cv-c.long .ti{font-size:.78em}
.cv-c .ed{flex:none;font:600 .5em/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:#625D56}
.cv-d{display:flex;flex-direction:column;justify-content:space-between;padding:.7em .7em .8em .9em}
.cv-d .sh{position:absolute;width:110%;aspect-ratio:1;border-radius:50%;left:45%;top:-50%;background:rgba(245,243,238,.10)}
.cv-d .au,.cv-d .ti{position:relative}
.cv-d .ti{font:700 1.15em/1.02 var(--ui);letter-spacing:-.03em}
.cv-d.long .ti{font-size:.88em}
.k0{background:#7A2E2A}.k1{background:#2C3E5C}.k2{background:#2F3A35}.k3{background:#C23B22}
.k4{background:#9C5230}.k5{background:#E3B43B;color:#242321}.k6{background:#C9B79C;color:#242321}.k7{background:#3B3A36}

/* ---------- Grilles et lignes de livres ---------- */
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 16px}
.bk{appearance:none;border:0;background:none;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;color:var(--ink)}
.bk .cv{width:100%;font-size:15px}
.bk>b{font:500 13px/17px var(--ui);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bk>span:not(.sr){font:400 12px/16px var(--ui);color:var(--stone-text)}
.hrow{display:flex;gap:16px;overflow-x:auto;margin:0 -20px;padding:4px 20px 8px;scrollbar-width:none}
.hrow::-webkit-scrollbar{display:none}
.hrow .bk{width:96px;flex:none}
.brow{appearance:none;border:0;background:none;width:100%;display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:16px;align-items:center;padding:12px 0;border-bottom:.5px solid var(--hairline);text-align:left;cursor:pointer;color:var(--ink)}
.brow .cv{width:56px;font-size:9.5px}
.brow .tt{font:500 17px/21px var(--serif)}

/* ---------- Divers ---------- */
.hero{background:var(--sand);padding:32px 0 24px;display:flex;justify-content:center;cursor:pointer;border:0;width:100%}
.meter{display:flex;gap:4px}
.meter i{width:4px;height:14px;border-radius:2px;background:var(--hairline)}
.meter i.on{background:var(--ink)}
.meter.neg i.on{background:var(--stone)}
.demo{display:inline-flex;align-items:center;height:18px;padding:0 8px;border:1px dashed var(--stone-text);border-radius:4px;font:600 10px/1 var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--stone-text);flex:none}
.note{padding:12px 16px;background:var(--sand);border-radius:10px;font:400 13px/18px var(--ui)}
.toast{position:absolute;left:20px;right:20px;bottom:100px;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:0 8px 0 16px;background:var(--ink);color:var(--on-ink);border-radius:12px;font:500 15px/20px var(--ui);box-shadow:0 8px 24px rgba(36,35,33,.2);animation:toastIn .2s ease}
.toast button{appearance:none;border:0;background:none;color:var(--accent);font:600 15px/20px var(--ui);height:44px;padding:0 12px;cursor:pointer}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* Confirmation tout en bas de l'écran, par-dessus la barre d'onglets, juste au-dessus de la barre d'accueil de l'iPhone */
#phone .toast{bottom:calc(12px + env(safe-area-inset-bottom,0px)) !important;z-index:60;min-height:56px;border-radius:999px !important;padding:0 8px 0 20px;animation:toastUp .32s cubic-bezier(.2,.9,.3,1.2) both}
#phone .toast svg{width:20px;height:20px;flex:none}
@keyframes toastUp{from{opacity:0;transform:translateY(120%)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#phone .toast{animation:none}}
.choice{appearance:none;cursor:pointer;border:1px solid var(--stone);background:transparent;border-radius:12px;padding:12px 16px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:4px;font:500 15px/20px var(--ui)}
.choice small{font:400 12px/16px var(--ui);color:var(--stone-text)}
.choice[aria-checked="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.choice[aria-checked="true"] small{color:var(--on-ink);opacity:.85}
.feel{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.feel button{appearance:none;cursor:pointer;height:74px;border-radius:12px;border:1px solid var(--stone);background:transparent;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font:500 13px/16px var(--ui)}
.feel svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
.feel button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.switch{appearance:none;border:0;cursor:pointer;width:51px;height:31px;border-radius:16px;background:var(--hairline);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--success)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.progress{display:flex;gap:4px}
.progress i{flex:1;height:3px;border-radius:2px;background:var(--hairline)}
.progress i.on{background:var(--ink)}
.empty{padding:48px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.bubble{align-self:flex-end;max-width:82%;padding:12px 16px;border-radius:20px 20px 6px 20px;background:var(--ink);color:var(--on-ink);font:400 17px/23px var(--ui)}
.bm{align-self:flex-start;max-width:100%;display:flex;flex-direction:column;gap:8px}
.bm p{font:400 17px/24px var(--ui)}
.dots{display:inline-flex;gap:8px;padding:12px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--stone);animation:pulse 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes pulse{0%,80%,100%{opacity:.25}40%{opacity:1}}
.learn{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:.5px solid var(--hairline)}
.learn .d{font:600 13px/18px var(--ui);color:var(--accent-ink)}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--hairline);border-top-color:var(--ink);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.scanframe{position:relative;width:220px;height:330px;margin:0 auto}
.scanframe span{position:absolute;width:36px;height:36px;border-color:currentColor;border-style:solid;border-width:0}
.scanframe .c1{top:0;left:0;border-top-width:3px;border-left-width:3px;border-radius:14px 0 0 0}
.scanframe .c2{top:0;right:0;border-top-width:3px;border-right-width:3px;border-radius:0 14px 0 0}
.scanframe .c3{bottom:0;left:0;border-bottom-width:3px;border-left-width:3px;border-radius:0 0 0 14px}
.scanframe .c4{bottom:0;right:0;border-bottom-width:3px;border-right-width:3px;border-radius:0 0 14px 0}
.shutter{appearance:none;cursor:pointer;width:76px;height:76px;border-radius:50%;border:3px solid var(--on-ink);background:transparent;display:grid;place-items:center}
.shutter i{width:60px;height:60px;border-radius:50%;background:var(--on-ink)}
.merchant{position:absolute;inset:0;background:#fff;color:#111;display:flex;flex-direction:column;font-family:var(--ui)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Évolution profil (itération 2) ---------- */
.nrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 12px 12px 16px;border-bottom:.5px solid var(--hairline)}
.nrow:last-child{border-bottom:0}
.seg.small{flex:none;grid-auto-columns:auto}
.seg.small button{height:30px;padding:0 8px;font-size:12px}
.bar{display:block;height:6px;border-radius:3px;background:var(--hairline);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:3px}
.stars{display:flex;gap:0}
.stars button{appearance:none;border:0;background:none;width:40px;height:44px;display:grid;place-items:center;cursor:pointer;color:var(--stone)}
.stars button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}
.stars button.on{color:var(--accent-ink)}
.stars button.on svg{fill:currentColor}
.stars button:focus-visible{outline:2px solid var(--ink);outline-offset:-2px;border-radius:8px}

/* =========================================================
   PISTE E · « Éditoriale native »
   Même structure et mêmes parcours que l'itération 2.
   On garde l'ADN (papier chaud, serif pour les livres, iOS natif)
   et on monte d'un cran : typo de maison d'édition, matières, mouvement.
   ========================================================= */
:root{
  --paper:#F4F1EA; --raised:#FFFDF9; --sand:#ECE6DA; --kraft:#E3D9C7; --hairline:#E0D9CC;
  --ink:#1F1E1C; --stone-text:#5E5952; --accent-ink:#8A5A1F;
}
/* Grands titres : passent en serif, plus grands, interlettrage resserré (règle Apple : on resserre en grandissant) */
.t-large{font:500 38px/40px var(--serif);letter-spacing:-.025em}
.t-title2{font:500 26px/30px var(--serif);letter-spacing:-.015em}
.t-title3{font:500 23px/27px var(--serif);letter-spacing:-.01em}
.t-book{font:500 28px/31px var(--serif);letter-spacing:-.02em}
/* Étiquettes : petites capitales espacées, comme un sommaire */
.label{font:600 11px/16px var(--ui);letter-spacing:.09em}
/* Boutons : rayon plus généreux, secondaires plus légers (papier + filet au lieu d'aplat sable) */
.b{border-radius:14px;transition:transform .1s ease-out}
.b:active{transform:scale(.97)}
.b-ghost{background:var(--raised);box-shadow:inset 0 0 0 1px var(--hairline)}
/* Puces d'humeur : papier + filet, sélection encre */
.tag{background:var(--raised);border-color:var(--hairline)}
.tag.on{border-color:var(--ink)}
/* Groupes : carte papier avec filet très léger */
.group{border-radius:16px;box-shadow:0 0 0 1px var(--hairline)}
/* Zone de couverture : lumière douce venue du haut, comme un livre posé sur une table */
.hero{background:radial-gradient(120% 90% at 50% 0%,#F7F1E6 0%,#E8DFCF 70%,#E1D6C3 100%)}
/* Barre d'onglets : verre dépoli, le contenu passe dessous */
.tabbar{background:rgba(255,253,249,.66);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.85),0 10px 30px rgba(31,30,28,.12)}
.tab[aria-current="page"]{background:#fff;box-shadow:0 1px 3px rgba(31,30,28,.08)}
.fadebar{background:linear-gradient(rgba(244,241,234,0),rgba(244,241,234,.9) 70%)}
/* Feuilles : bords plus ronds, poignée plus discrète */
.sheet{border-radius:28px 28px 0 0;touch-action:none}
.grabber{background:#CFC7B9}
/* Les anciennes animations CSS sont remplacées par des ressorts (voir script) */
.push-enter,.sheet-enter,.scrim.fade-enter{animation:none}
.layer{will-change:transform}
@media (prefers-reduced-transparency:reduce){.tabbar{background:var(--raised);backdrop-filter:none;-webkit-backdrop-filter:none}}


/* =========================================================
   SURFACE D'INTELLIGENCE
   Règle : tout ce que BookMatch déduit ou rédige à partir du profil
   (pourquoi ce livre, portrait, ce qui a été appris, réponses de l'assistant)
   est posé sur cette surface. Le reste (faits sur le livre, résumé) reste sur le papier.
   ========================================================= */
:root{
  --ai-bg:linear-gradient(140deg,#F5E5C9 0%,#F2E2DD 55%,#E9E1F1 100%); /* ocre → rosé → lilas très pâles : une lueur, pas un aplat */
  --ai-line:rgba(138,90,31,.24);
  --ai-ink:#7A4E18;
}
.ai{position:relative;background:var(--ai-bg);border-radius:16px;padding:16px 16px 16px;box-shadow:inset 0 0 0 1px var(--ai-line);display:flex;flex-direction:column;gap:8px}
.ai.sm{padding:12px 12px 12px;border-radius:12px;gap:4px}
.ai-mark{display:inline-flex;align-items:center;gap:8px;font:600 11px/16px var(--ui);letter-spacing:.09em;text-transform:uppercase;color:var(--ai-ink)}
.ai-mark svg{width:12px;height:12px;flex:none}
.ai-mark{white-space:nowrap;letter-spacing:.08em}               /* surtitre : 1 ligne, petit, ocre */
.ai-lead{font:500 21px/25px var(--serif);letter-spacing:-.01em;color:var(--ink);margin-top:-4px} /* titre : le verdict, en serif */
.ai p.t-sub,.ai p.t-body{color:#3B3833}                          /* texte : lecture, un cran plus doux que le titre */
.ai .row-src .t-foot{font-size:13px}
.ai .row-src{display:flex;align-items:center;gap:8px}
/* Assistant : ses réponses sont des surfaces d'intelligence, tes messages restent sur le papier */
.bm{background:var(--ai-bg);box-shadow:inset 0 0 0 1px var(--ai-line);border-radius:16px 16px 16px 6px;padding:12px 16px}
.bm .label{color:var(--ai-ink)}
@media (prefers-contrast:more){.ai,.bm{background:#F7EBD7;box-shadow:inset 0 0 0 1.5px var(--ai-ink)}}

/* =========================================================
   CONTRAT DES COMPOSANTS (règles qui ne se négocient pas)
   Comme dans Figma : un composant garde sa taille, quel que soit le conteneur.
   ========================================================= */
/* 1. Rien d'interactif ne se fait écraser par une colonne trop pleine */
.b,.tag,.choice,.row,.field,.area,.feel,.stars,.group,.cover,.bk,.ai,.toggle,.switch{flex-shrink:0}
/* 2. Tailles fixes du bouton (comme les variantes Size d'un composant) */
.b{min-height:50px;height:auto;white-space:nowrap}
.b.b-text{min-height:44px}
.b[style*="height:44px"]{min-height:44px}
.b[style*="height:36px"]{min-height:36px}
/* 3. Zone sûre : rien ne touche l'indicateur d'accueil de l'iPhone (34 px) */
.sheet-body{padding-bottom:34px}
/* 4. Action principale d'une feuille : toujours visible, collée en bas, sur un fondu papier */
.sheet-body > .b-primary.b-block:last-child{position:sticky;bottom:0;z-index:2;
  box-shadow:0 -24px 20px -6px var(--raised),0 34px 0 0 var(--raised)}

/* =========================================================
   PISTE F · KIT RELUME DE BASE (non modifié)
   Valeurs reprises telles quelles du kit Relume :
   - Couleurs : neutres noir → blanc, aucune couleur d'accent
   - Rayons : 0 partout (rounded-button, card, form, badge… = 0rem)
   - Police : Roboto
   - Échelle typo mobile : h1 40 · h2 36 · h3 32 · h4 24 · h5 20 · h6 18 · regular 16 · small 14 · tiny 12
   - Bouton : bordure 1 px, px-6 py-3, texte normal (non gras)
   - Champ : bordure 1 px, hauteur min 44 px (min-h-11)
   - Espacements : marges 5 %, carte p-6 (24), titre→texte 20, texte→boutons 24, entre sections 48
   ========================================================= */
:root{
  /* Neutres Relume */
  --r-darkest:#000000; --r-darker:#222222; --r-dark:#444444; --r-neutral:#666666;
  --r-light:#AAAAAA; --r-lighter:#CCCCCC; --r-lightest:#EEEEEE; --r-white:#FFFFFF;
  /* Système Relume (succès / erreur) */
  --r-success:#027A48; --r-error:#B42318;
  /* On rebranche les tokens du prototype sur ceux de Relume : les écrans n'ont pas à changer */
  --paper:var(--r-white); --raised:var(--r-white); --sand:var(--r-lightest); --kraft:var(--r-lightest);
  --hairline:var(--r-darkest); --ink:var(--r-darkest); --on-ink:var(--r-white);
  --stone:var(--r-neutral); --stone-text:var(--r-dark);
  --accent:var(--r-darkest); --accent-ink:var(--r-darkest); --accent-soft:var(--r-lightest);
  --success:var(--r-success); --danger:var(--r-error);
  --ui:Roboto,system-ui,sans-serif; --serif:Roboto,system-ui,sans-serif;
  --ai-bg:var(--r-lightest); --ai-line:transparent; --ai-ink:var(--r-darkest);
}
html,body{font-family:var(--ui)}

/* ---------- Rayons : 0 (kit Relume) ---------- */
#phone .b,#phone .tag,#phone .choice,#phone .group,#phone .field,#phone .area,#phone .sheet,#phone .tabbar,#phone .tab,
#phone .toast,#phone .note,#phone .seg,#phone .seg *,#phone .bubble,#phone .bm,#phone .ai,#phone .demo,#phone .bar,#phone .bar i,
#phone .add,#phone .feel button{border-radius:0 !important}
/* Ombres et verre : absents du kit */
#phone .tabbar,#phone .tab,#phone .sheet,#phone .toast,#phone .group,#phone .b,#phone .add{box-shadow:none !important}
#phone .tabbar{backdrop-filter:none;-webkit-backdrop-filter:none}
#phone .fadebar{display:none}

/* ---------- Typographie : échelle Relume (mobile) ---------- */
.t-large{font:700 32px/1.2 var(--ui);letter-spacing:-.01em}          /* h3 */
.t-title2{font:700 24px/1.3 var(--ui);letter-spacing:-.01em}         /* h4 */
.t-title3{font:700 20px/1.4 var(--ui);letter-spacing:-.01em}         /* h5 */
.t-head{font:700 18px/1.4 var(--ui);letter-spacing:-.01em}           /* h6 */
.t-book{font:700 24px/1.3 var(--ui);letter-spacing:-.01em}           /* h4 */
.t-book-m{font:700 18px/1.4 var(--ui);letter-spacing:-.01em}         /* h6 */
.t-body{font:400 16px/1.5 var(--ui)}                                 /* regular */
.t-sub{font:400 16px/1.5 var(--ui)}                                  /* regular */
.t-foot{font:400 14px/1.5 var(--ui)}                                 /* small */
.label{font:600 14px/1.5 var(--ui);letter-spacing:0;text-transform:none;color:var(--ink)} /* tagline Relume */

/* ---------- Bouton (variantes Relume) ---------- */
.b{font:400 16px/1.5 var(--ui);min-height:50px;padding:12px 24px;border:1px solid var(--r-darkest);gap:12px;transition:transform .1s ease-out,background .2s ease-in-out}
.b-primary{background:var(--r-darkest);color:var(--r-white)}                              /* default */
.b-ghost,.b-line{background:transparent;color:var(--r-darkest);box-shadow:none}            /* secondary */
.b-text{border:0;padding:0;color:var(--r-darkest);gap:8px}                                  /* link */
.b-text.strong{font-weight:400;text-decoration:underline;text-underline-offset:3px}
.b[disabled]{opacity:.5;background:var(--r-darkest);color:var(--r-white)}
.back{color:var(--r-darkest)}

/* ---------- Puces / filtres (bouton « sm » Relume) ---------- */
.tag{height:auto;min-height:42px;padding:8px 20px;background:transparent;border:1px solid var(--r-darkest);font:400 16px/1.5 var(--ui)}
.tag.on{background:var(--r-darkest);color:var(--r-white)}
.tag.off{border:1px dashed var(--r-neutral)}
.choice,.feel button{border:1px solid var(--r-darkest) !important;background:transparent}
.demo{background:var(--r-lightest);color:var(--r-darkest);font:600 14px/1.5 var(--ui);padding:4px 8px}  /* badge */

/* ---------- Carte, liste, champ ---------- */
.group{background:var(--r-white);border:1px solid var(--r-darkest)}
.row{padding:0 24px;min-height:56px}
.field{background:var(--r-white);border:1px solid var(--r-darkest);min-height:44px;height:auto}
.area{border:1px solid var(--r-darkest)}

/* ---------- Surface d'intelligence = carte de fond Relume (neutral-lightest), p-6 ---------- */
.ai{background:var(--r-lightest);box-shadow:none;padding:24px;gap:12px}
.ai.sm{padding:16px;gap:8px}
.ai-mark{font:600 14px/1.5 var(--ui);letter-spacing:0;text-transform:none;color:var(--r-darkest)}
.ai-lead{font:700 18px/1.4 var(--ui);letter-spacing:-.01em;color:var(--r-darkest);margin:0}
.ai p.t-sub,.ai p.t-body{color:var(--r-darkest)}
.bm{background:var(--r-lightest);box-shadow:none;padding:16px}
.bubble{background:var(--r-darkest)}

/* ---------- Zone visuelle du livre : fond d'image placeholder Relume ---------- */
.hero{background:var(--r-lightest)}

/* ---------- Navigation : barre pleine largeur, filet supérieur (pas de verre) ---------- */
#phone .dock{left:0;right:0;bottom:0;padding:8px 5% 32px;background:var(--r-white);border-top:1px solid var(--r-darkest);gap:12px}
#phone .tabbar{flex:1;justify-content:space-between;background:transparent;height:56px;padding:0}
#phone .tab{min-width:0;flex:1;font:400 12px/1.5 var(--ui);color:var(--r-neutral)}
#phone .tab[aria-current="page"]{background:transparent;color:var(--r-darkest);font-weight:600}
#phone .add{width:48px;height:48px;background:var(--r-darkest)}

/* ---------- Feuilles : fond blanc, filet noir (modale Relume) ---------- */
.sheet{background:var(--r-white);border-top:1px solid var(--r-darkest)}
.sheet-head{border-bottom:1px solid var(--r-darkest)}
.grabber{background:var(--r-lighter);border-radius:3px}
.sheet-body > .b-primary.b-block:last-child{box-shadow:0 -24px 20px -6px var(--r-white),0 34px 0 0 var(--r-white) !important}
.toast{background:var(--r-darkest)}

/* ---------- Espacements Relume ---------- */
.t-title3[style*="margin-top:32px"],h3[style*="margin-top:32px"]{margin-top:48px !important}   /* entre sections */
.layer.pushed .pad[style*="gap:24px"]{gap:32px !important}


/* Corrections après rendu */
#phone .group{border:1px solid var(--r-darkest) !important}
#phone .group-title{margin-left:0}
.seg{background:transparent;padding:0;gap:0}                                   /* onglets Relume */
.seg button{height:auto;min-height:40px;padding:8px 12px;font:400 14px/1.5 var(--ui);border:1px solid transparent}
.seg button[aria-selected="true"]{background:var(--r-white);border-color:var(--r-darkest);box-shadow:none;font-weight:600}

/* =========================================================
   TOUCHE BOOKMATCH (posée par-dessus Relume, sans toucher aux composants)
   On ne change que des tokens + 3 signatures :
   1. Neutres réchauffés : papier au lieu du blanc pur, encre au lieu du noir pur
   2. Serif Newsreader réservée aux livres (titres d'œuvres) — l'UI reste en Roboto
   3. Ocre réservé à l'intelligence (surface IA, étoile, verdict)
   ========================================================= */
:root{
  --r-darkest:#242321;   /* encre (au lieu de #000) */
  --r-lightest:#ECE7DD;  /* sable (au lieu de #EEE) */
  --r-white:#FFFDF9;     /* papier clair pour cartes et feuilles */
  --b-paper:#F5F3EE;     /* fond des écrans */
  --b-ocre:#8A5A1F;
  --paper:var(--b-paper);
  --ai-bg:linear-gradient(140deg,#F5E5C9 0%,#F2E2DD 55%,#E9E1F1 100%);
  --ai-ink:var(--b-ocre);
  --serif:Newsreader,Georgia,serif;
}
/* 1. Fond papier, cartes claires */
#phone .layer,#phone .dock{background:var(--b-paper)}
#phone .scroll{background:var(--b-paper)}
.hero{background:var(--r-lightest)}

/* 2. Les titres de livres en serif : la seule voix « littéraire » de l'interface */
.t-book{font:500 28px/1.15 var(--serif);letter-spacing:-.015em}
.t-book-m{font:500 20px/1.25 var(--serif);letter-spacing:-.01em}
#phone .layer.pushed .t-book{font-size:30px}

/* 3. L'ocre ne sert qu'à l'intelligence */
.ai-mark,.ai-mark svg{color:var(--b-ocre)}
.ai-lead{font:500 21px/1.2 var(--serif);letter-spacing:-.01em;color:var(--r-darkest)}
.bm .label{color:var(--b-ocre)}

/* =========================================================
   COUCHE MARQUE BOOKMATCH (par-dessus le kit Relume)
   Règle : on ne touche ni aux composants ni aux espacements Relume,
   seulement à quelques tokens. 4 touches, pas plus :
   1. Encre et papier chauds au lieu du noir et blanc purs
   2. Titres de livres en serif (Newsreader) : la signature littéraire
   3. Ocre réservé à l'intelligence (étoile + libellé)
   4. Sable chaud pour les zones d'image et la surface IA
   ========================================================= */
:root{
  --r-darkest:#242321;           /* encre BOOKMATCH (au lieu de #000) */
  --r-white:#FBFAF7;             /* papier clair (au lieu de #FFF) */
  --r-lightest:#EFEBE3;          /* sable léger (au lieu de #EEE) */
  --r-lighter:#D9D3C7; --r-neutral:#6E6961; --r-dark:#4A4641;
  --bm-ocre:#8A5A1F;             /* accent de marque, usage réservé */
  --bm-sable:#E5E0D6;
  --paper:#F5F3EE;               /* fond d'écran papier */
  --serif:Newsreader,Georgia,serif;
}
#phone .layer,#phone .phone{background:var(--paper)}
/* 2. Titres de livres en serif (le reste de l'interface reste en Roboto) */
.t-book{font:500 26px/1.2 var(--serif);letter-spacing:-.01em}
.t-book-m{font:500 20px/1.25 var(--serif);letter-spacing:0}
.bk-t,.hrow .t-foot:first-of-type{font-family:var(--serif)}
/* 3. Ocre = BookMatch parle (étoile, libellé) */
.ai-mark{color:var(--bm-ocre)}
.bm .label{color:var(--bm-ocre)}
/* 4. Sable chaud : zone de couverture et surface IA */
.hero{background:var(--bm-sable)}
.ai,.bm{background:#F1E8D8}
/* Lien d'en-tête de feuille (OK, Fermer…) : encre, pas ocre */
.b-text{color:var(--r-darkest)}

/* CTA en pilule : tous les boutons d'action (principal, secondaire) et le bouton « + » */
#phone .b:not(.b-text),#phone .add{border-radius:999px !important}

/* Puces (humeurs, filtres, « Suivre ») en pilule, comme les CTA */
#phone .tag{border-radius:999px !important}

/* Champs sur une ligne (recherche, assistant) en pilule ; les zones de texte multi-lignes restent carrées */
#phone .field{border-radius:999px !important;padding:0 16px}

/* Icônes Solar : trait 1,5 px fourni par l'icône, on n'impose plus le nôtre */
.ico,.tab svg{stroke:none;fill:none}
.stars button.on svg *{fill:currentColor}
.ai-mark svg{width:16px;height:16px}

/* =========================================================
   ÉCHELLE DE RAYONS — une seule règle pour toute l'app
   pill 999 : ce qu'on touche pour agir ou choisir (boutons, puces, champs, onglets)
   lg   24  : les grandes surfaces qui montent (feuilles)
   md   16  : les conteneurs (cartes, listes, surface IA, choix, zones de texte, messages)
   sm    8  : les petits éléments (badges, vignettes, notes)
   xs    3  : les couvertures (un livre a des coins presque droits)
   0        : ce qui touche les bords de l'écran (zone de couverture, barre d'onglets)
   ========================================================= */
:root{--rad-pill:999px;--rad-lg:24px;--rad-md:16px;--rad-sm:8px;--rad-xs:3px}
#phone .b:not(.b-text),#phone .add,#phone .tag,#phone .field,#phone .seg,#phone .seg button{border-radius:var(--rad-pill) !important}
#phone .sheet{border-radius:var(--rad-lg) var(--rad-lg) 0 0 !important}
#phone .group,#phone .ai,#phone .ai.sm,#phone .bm,#phone .choice,#phone .feel button,#phone .area,#phone .note,#phone .toast{border-radius:var(--rad-md) !important}
#phone .bubble{border-radius:var(--rad-md) var(--rad-md) var(--rad-sm) var(--rad-md) !important}
#phone .bm{border-radius:var(--rad-md) var(--rad-md) var(--rad-md) var(--rad-sm) !important}
#phone .demo,#phone .bar,#phone .bar i{border-radius:var(--rad-sm) !important}
#phone .cover{border-radius:var(--rad-xs) !important}
/* Rayons écrits à la main dans les écrans : on les ramène sur l'échelle */
#phone [style*="border-radius"]:not([style*="50%"]):not(.layer):not(.cover):not(.iconbtn){border-radius:var(--rad-sm) !important}
#phone .hero,#phone .dock,#phone .tabbar,#phone .tab{border-radius:0 !important}
/* Les listes dans une carte : le contenu ne déborde pas des coins arrondis */
#phone .group{overflow:hidden}

#phone .iconbtn[style*="border-radius"],#phone #pageIn{border-radius:var(--rad-pill) !important}   /* bouton icône et petit champ = pill */
#phone div[style*="border-radius:3px"]{border-radius:var(--rad-xs) !important}                      /* emplacement de couverture */

/* Action collée en bas de feuille : le fondu papier doit passer avant la règle « pas d'ombre » */
#phone .sheet-body > .b-primary.b-block:last-child{box-shadow:0 -24px 20px -6px var(--r-white),0 40px 0 6px var(--r-white) !important}

/* =========================================================
   ÉCHELLE D'ESPACEMENT — grille de 4, comme une grille Figma
   4 · 8 · 12 · 16 · 20 · 24 · 32 · 48
   Règles de rythme (proximité = relation) :
   - marge d'écran           20
   - intérieur des cartes    20 (petite carte 16)
   - libellé → son contenu    8
   - éléments d'une même section 16
   - titre de groupe          32 au-dessus, 8 au-dessous
   - entre deux sections      48
   ========================================================= */
:root{--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-7:32px;--sp-8:48px}
/* Intérieur des conteneurs : une seule valeur, pour que tous les textes s'alignent sur la même verticale */
#phone .row{padding:var(--sp-3) var(--sp-5);min-height:56px}
#phone .ai{padding:var(--sp-5);gap:var(--sp-2)}
#phone .ai.sm{padding:var(--sp-4);gap:var(--sp-1)}
#phone .ai .ai-lead{margin-bottom:var(--sp-1)}
#phone .ai .row-src{margin-top:var(--sp-2)}
#phone button.group[style*="padding"]{padding:var(--sp-5) !important;gap:var(--sp-3) !important}
#phone .bm{padding:var(--sp-4)}
/* Titres de groupe (« Votre profil », « Ce que BookMatch a compris ») */
#phone .group-title{margin:var(--sp-7) 0 var(--sp-2) 0 !important}
/* Libellé de champ / de groupe de puces → son contenu */
#phone h2.label[style*="margin-bottom"]{margin-bottom:var(--sp-2) !important}
/* Puces : même écart partout */
#phone .tags{gap:var(--sp-2)}
/* Feuilles : marges identiques à l'écran */
#phone .sheet-body{padding-left:var(--sp-5);padding-right:var(--sp-5)}
#phone .sheet-head{padding:0 var(--sp-4)}

/* =========================================================
   FEUILLES DU BAS — structure fixe, comme un composant Figma
   poignée (8 haut / 8 bas) → en-tête 56 (titre sur 1 ligne) → filet → corps (20 de marge)
   ========================================================= */
#phone .grabber{margin:var(--sp-2) auto 0}
#phone .sheet-head{display:grid;grid-template-columns:minmax(72px,auto) minmax(0,1fr) minmax(72px,auto);column-gap:var(--sp-3);
  align-items:center;min-height:56px;height:auto;padding:var(--sp-2) var(--sp-5) var(--sp-3)}
#phone .sheet-head .title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:600 17px/22px var(--ui);text-align:center}
#phone .sheet-head .b-text{min-height:44px;font-size:16px}
/* Le corps commence toujours à 20 du filet, et finit à 34 (zone de l'indicateur d'accueil) */
#phone .sheet-head + .sheet-body,#phone .sheet-head ~ .sheet-body{padding-top:var(--sp-5) !important}
#phone .sheet-body{padding-bottom:34px}
/* Feuilles sans en-tête (succès, ce que BookMatch a appris) : 24 sous la poignée */
#phone .grabber + .sheet-body{padding-top:var(--sp-6) !important}

/* Bouton secondaire : aplat sable foncé (plus lisible qu'un simple contour), texte encre */
:root{--btn-secondary:#E2DCD0;--btn-secondary-press:#D6CFC1}
/* Bouton secondaire : fond transparent + contour encre de 1 px, en pilule (même style que le bouton « Suivre ») */
#phone .b-ghost,#phone .b-line{background:transparent !important;border:1px solid var(--r-darkest) !important;color:var(--r-darkest);font-weight:500}
#phone .b-ghost:active,#phone .b-line:active{background:rgba(36,35,33,.06) !important}

/* =========================================================
   CONTRÔLE SEGMENTÉ (Bibliothèque, Envies, Préférences)
   Un rail sable qui contient toutes les options, à parts égales ;
   l'option choisie est un aplat encre, comme une puce sélectionnée.
   Chaque option affiche toujours son compteur, même à 0.
   ========================================================= */
#phone .seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;background:var(--btn-secondary);border:0;height:auto}
#phone .seg button{display:flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 8px;border:0 !important;
  background:transparent;color:var(--r-darkest);font:500 14px/1.2 var(--ui);white-space:nowrap;box-shadow:none !important;transition:background .2s ease,color .2s ease}
#phone .seg button[aria-selected="true"]{background:var(--r-darkest) !important;color:var(--r-white);font-weight:600}
#phone .seg .seg-n{font:500 12px/1 var(--ui);min-width:20px;height:20px;padding:0 6px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;
  background:rgba(36,35,33,.08);color:var(--r-dark)}
#phone .seg button[aria-selected="true"] .seg-n{background:rgba(251,250,247,.18);color:var(--r-white)}

#phone .seg .seg-n{border-radius:999px !important}

/* Champ dans une rangée (recherche + bouton) : le champ prend la place restante, il ne pousse plus le bouton hors écran */
#phone .pad[style*="display:flex"] > .field,#phone .sheet .pad > .field{flex:1 1 auto;min-width:0;width:auto}
/* Rangée de recherche sous l'en-tête d'une feuille : 20 sous le filet, marges de la feuille */
#phone .sheet-head + .pad{padding:var(--sp-5) var(--sp-5) 0}
/* Bouton icône à côté d'un champ : même hauteur que le champ (44), rond, fond secondaire */
#phone .pad > .iconbtn{width:44px !important;height:44px !important;flex:none;background:var(--btn-secondary) !important}
/* Focus : bordure encre + halo léger, au lieu d'un double contour épais */
#phone .field:focus-within{box-shadow:0 0 0 3px rgba(36,35,33,.12) !important;border-color:var(--r-darkest)}
#phone textarea.area:focus{box-shadow:0 0 0 3px rgba(36,35,33,.12) !important}
#phone .field input:focus{outline:none}

#phone .sheet .pad > .iconbtn,#phone .pad > .iconbtn{border-radius:999px !important}

/* Pied d'écran de l'onboarding : fondu papier, le contenu ne se voit plus sous le bouton */
#phone .onb-foot{background:linear-gradient(rgba(245,243,238,0),var(--paper) 24px);z-index:3}
/* Bouton désactivé : plein et opaque (pas de transparence qui laisse voir le contenu) */
#phone .b[disabled]{opacity:1 !important;background:#D9D3C7 !important;border-color:#D9D3C7 !important;color:#8A857C !important}

/* Barre de progression de l'onboarding : étapes à venir en sable, étapes faites en encre */
#phone .progress i{background:#D9D3C7 !important}
#phone .progress i.on{background:var(--r-darkest) !important}

/* Barre de progression du profil : rail sable (ce qui reste à faire), remplissage encre (ce qui est fait).
   Avant, le rail utilisait --hairline, devenu noir avec le kit Relume : rail et remplissage avaient la même couleur. */
#phone .bar{background:#D9D3C7 !important}
#phone .bar i{background:var(--r-darkest) !important}

/* Contrôle segmenté : largeur selon le contenu + même marge intérieure partout
   (au lieu de 4 colonnes égales qui laissent « Lus » flotter et serrent « En cours ») */
#phone .seg{display:flex !important;gap:2px}
#phone .seg button{flex:1 1 auto;padding:0 10px;gap:6px;min-width:0}
#phone .seg .seg-n{min-width:20px;height:20px;padding:0 5px;font-size:12px}

/* =========================================================
   STATUTS DE LA BIBLIOTHÈQUE — rangée de puces qui défile
   Puces espacées (16 de marge intérieure, 8 entre elles), la rangée déborde jusqu'au bord de l'écran
   et se fait glisser au doigt ; un fondu à droite indique qu'il y a une suite.
   On peut aussi glisser le contenu vers la gauche / la droite pour changer de statut.
   ========================================================= */
#phone .seg-scroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;scroll-padding:0 20px;
  margin:16px -20px 0;padding:2px 20px 4px;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
#phone .seg-scroll::-webkit-scrollbar{display:none}
#phone .seg-scroll button{flex:none;scroll-snap-align:start;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;
  border-radius:999px;border:1px solid var(--r-darkest);background:transparent;color:var(--r-darkest);font:500 15px/1 var(--ui);white-space:nowrap;transition:background .2s ease,color .2s ease}
#phone .seg-scroll button[aria-selected="true"]{background:var(--r-darkest);color:var(--r-white);font-weight:600}
#phone .seg-scroll .seg-n{font:500 12px/1 var(--ui);min-width:22px;height:22px;padding:0 6px;border-radius:999px !important;display:inline-flex;align-items:center;justify-content:center;background:rgba(36,35,33,.08);color:var(--r-dark)}
#phone .seg-scroll button[aria-selected="true"] .seg-n{background:rgba(251,250,247,.2);color:var(--r-white)}
#phone .lib-swipe{touch-action:pan-y;will-change:transform}


/* ---------- App installée sur l'écran d'accueil (plein écran) ---------- */
@media (display-mode: standalone){
  html.pwa .phone{margin-top:-40px;height:calc(100dvh + 40px) !important}
}
html.pwa-ios .phone{margin-top:-40px;height:calc(100dvh + 40px) !important}

/* ---------- Sur un vrai iPhone ---------- */
html,body{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
#phone button,#phone .tag,#phone .tab{touch-action:manipulation;-webkit-user-select:none;user-select:none}  /* pas de zoom au double appui, pas de sélection de texte sur les boutons */
@media (max-width:820px){
  html,body{background:var(--paper);overscroll-behavior:none}
  .phone{height:100dvh !important;width:100vw !important;border-radius:0 !important;box-shadow:none !important}
}

/* =========================================================
   PILE DE CARTES « UNIVERS » (onboarding)
   ========================================================= */
#phone .udeck{position:relative;height:360px;margin-top:24px}
#phone .ucard{position:absolute;inset:0;background:var(--r-white);border:1px solid var(--r-darkest);border-radius:var(--rad-md);
  display:flex;flex-direction:column;align-items:center;padding:24px 20px;touch-action:none;user-select:none;will-change:transform;cursor:grab}
#phone .ucard.next{transform:translateY(12px) scale(.95);opacity:.9;pointer-events:none}
#phone .ucovers{position:relative;height:170px;width:100%;display:flex;justify-content:center;align-items:flex-end;margin-bottom:20px;background:var(--bm-sable);border-radius:var(--rad-sm);padding-bottom:16px}
#phone .uc{margin:0 -10px}
#phone .uc0{transform:rotate(-7deg) translateY(4px)} #phone .uc1{z-index:2} #phone .uc2{transform:rotate(7deg) translateY(4px)}
#phone .ucount{font:500 12px/1 var(--ui);color:var(--r-neutral);margin-bottom:8px}
#phone .ucat{font:500 28px/1.15 var(--serif);text-align:center;margin:0}
#phone .usub{font:400 14px/1.5 var(--ui);color:var(--r-dark);text-align:center;margin:8px 0 0}
#phone .ustamp{position:absolute;top:20px;padding:6px 12px;border-radius:999px;font:600 13px/1 var(--ui);opacity:0;z-index:3;pointer-events:none}
#phone .ustamp.like{left:20px;background:var(--r-darkest);color:var(--r-white)}
#phone .ustamp.no{right:20px;background:var(--r-white);color:var(--r-darkest);border:1px solid var(--r-darkest)}
#phone .uacts{display:flex;justify-content:center;align-items:center;gap:20px;margin-top:24px}
#phone .uact{width:64px;height:64px;border-radius:999px !important;border:0;display:flex;align-items:center;justify-content:center;transition:transform .1s ease-out}
#phone .uact:active{transform:scale(.94)}
#phone .uact .ico{width:28px;height:28px}
#phone .uact.no{background:var(--btn-secondary);color:var(--r-darkest)}
#phone .uact.yes{background:var(--r-darkest);color:var(--r-white)}
#phone .uact.undo{width:44px;height:44px;background:transparent;color:var(--r-dark)}
#phone .uact.undo .ico{width:22px;height:22px}
#phone .uact[disabled]{opacity:.3}
#phone .udone{margin-top:24px}

/* Carte univers : sans sous-genres, la zone visuelle prend toute la hauteur disponible */
#phone .ucard{padding:16px 16px 24px}
#phone .ucovers{flex:1;height:auto;min-height:0;margin-bottom:20px;padding-bottom:28px;overflow:hidden}
#phone .uc{margin:0 -14px}

/* Livres dézoomés : plus d'air autour de l'éventail */
#phone .ucovers{align-items:center;padding:24px 0}
#phone .uc{margin:0 -6px}
#phone .uc0{transform:rotate(-6deg) translateY(6px)} #phone .uc2{transform:rotate(6deg) translateY(6px)}

#phone .udef{font:400 15px/1.4 var(--ui);color:var(--r-dark);text-align:center;margin:6px 0 0;max-width:280px}
#phone .ucard{padding-bottom:20px}

/* Recherche intelligente */
#phone .field.smart{position:relative}
#phone .field.smart .smart-badge{margin-left:auto;display:inline-flex;color:var(--bm-ocre)}
#phone .field.smart .smart-badge .ico{width:18px;height:18px}
#phone .ai .ai-books{margin-top:4px;border-top:1px solid rgba(36,35,33,.12)}
#phone .ai .ai-books .brow{background:transparent;border-bottom:1px solid rgba(36,35,33,.12)}
#phone .ai .ai-books .brow:last-child{border-bottom:0}

#phone .ai-tag{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:999px;background:rgba(138,90,31,.12);color:var(--bm-ocre);font:600 13px/1 var(--ui)}
#phone input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}

/* Recherche intelligente intégrée à Découvrir */
#phone .smartbar{display:flex;align-items:center;gap:12px;margin-top:16px}
#phone .smartbar .field{flex:1;min-width:0}
#phone .smartbar input{flex:1;min-width:0;border:0;background:transparent;font:400 16px/1.4 var(--ui);color:var(--r-darkest);outline:none}
#phone .smart-clear{display:none;border:0;background:var(--btn-secondary);width:24px;height:24px;border-radius:999px;align-items:center;justify-content:center;padding:0;flex:none}
#phone .smart-clear .ico{width:14px;height:14px}
#phone .smart-cancel{display:none}
#phone .searching .smart-cancel{display:inline-flex}
#phone .searching .smart-badge{display:none}
#phone .searching.has-q .smart-clear{display:inline-flex}
/* Pendant la recherche : le reste de Découvrir s'efface, les résultats prennent la place */
#phone .scroll.searching > :not(:first-child){display:none !important}
#phone .scroll.searching > .pad:first-child > :not(.smartbar):not(.smart-results):not(:first-child){display:none}
#phone .smart-results:empty{display:none}

/* Menu déroulant compact sous la barre (superposé, le reste de la page ne bouge pas) */
#phone .smartwrap{position:relative;z-index:6}
#phone .smart-drop{display:none;position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--r-white);border:1px solid var(--r-darkest);border-radius:var(--rad-md);
  overflow:hidden;box-shadow:0 12px 32px rgba(36,35,33,.14)}
#phone .smart-drop.open{display:block}
#phone .sd-row{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 16px;border:0;background:transparent;text-align:left;border-bottom:1px solid var(--hairline-soft,#E4DED3)}
#phone .sd-row:last-child{border-bottom:0}
#phone .sd-row:active{background:#F1EDE5}
#phone .sd-ai{background:#F1E8D8}
#phone .sd-ai .sd-ico{color:var(--bm-ocre)}
#phone .sd-ico{display:inline-flex;color:var(--r-neutral);flex:none}
#phone .sd-ico .ico{width:18px;height:18px}
#phone .sd-txt{display:flex;flex-direction:column;min-width:0}
#phone .sd-txt b{font:500 15px/1.3 var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#phone .sd-txt small{font:400 12px/1.3 var(--ui);color:var(--r-neutral)}
#phone .sd-empty{padding:14px 16px;font:400 14px/1.4 var(--ui);color:var(--r-neutral)}
/* Résultats retenus : une seule rangée de couvertures, la page Découvrir reste en dessous */
#phone .smart-pick{margin-top:16px}
#phone .smart-pick .rail{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:8px -20px 0;padding:4px 20px}
#phone .smart-pick .bk{border:0;background:none;padding:0;text-align:left;flex:none}
#phone .has-q .smart-clear{display:inline-flex}
#phone .has-q .field.smart .smart-badge{display:none}

/* Section « Sortez de vos habitudes » : une carte, 3 niveaux (livre → pourquoi → action) */
#phone .disc-card{margin-top:48px}
#phone .dc-body{margin-top:16px;padding:20px;display:flex;flex-direction:column;gap:16px}
#phone .dc-book{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:16px;align-items:center;border:0;background:none;padding:0;text-align:left;width:100%}
#phone .dc-meta{display:flex;flex-direction:column;gap:4px;min-width:0}
#phone .dc-univ{align-self:flex-start;display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:var(--btn-secondary);font:600 12px/1 var(--ui);color:var(--r-darkest);margin-bottom:4px}
#phone .dc-chev{color:var(--r-neutral);display:inline-flex}
#phone .dc-body .ai.sm{margin:0}
#phone .dc-body .b-block{margin:0}

/* « Sortez de vos habitudes » sans cadre : plus de bordure ni d'arrondi, le contenu s'aligne sur la marge de l'écran */
#phone .group.dc-body{border:0 !important;border-radius:0 !important;background:transparent;padding:0;overflow:visible}
/* Vraie couverture : l'image remplit le format livre, le dos ombré reste par-dessus */
#phone .cv-img{background:var(--bm-sable)}
#phone .cv-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

/* =========================================================
   DIRECTION « GALERIE BLANCHE » (piste 4, nov. 2026)
   Couche finale : on ne change que des tokens et quelques surfaces.
   Blanc, gris doux, encre ; Inter Tight partout ; indigo réservé à l'intelligence.
   ========================================================= */
:root{
  --r-darkest:#0B0B0B; --r-white:#FFFFFF; --r-lightest:#F4F4F2; --r-lighter:#D9D9D5; --r-neutral:#6E6E6A; --r-dark:#55554F;
  --paper:#FFFFFF; --raised:#FFFFFF; --sand:#F4F4F2; --kraft:#F4F4F2; --hairline:#ECECEA; --gl-line:#D9D9D5;
  --ink:#0B0B0B; --on-ink:#FFFFFF; --stone:#8A8A85; --stone-text:#6E6E6A;
  --gl-ai:#4B3FD1; --gl-ai-bg:#F1F0FB;
  --bm-sable:#F4F4F2; --bm-ocre:var(--gl-ai); --b-ocre:var(--gl-ai); --ai-ink:var(--gl-ai); --accent-ink:var(--ink);
  --btn-secondary:#F4F4F2; --btn-secondary-press:#ECECEA;
  --ui:"Inter Tight",Inter,-apple-system,system-ui,sans-serif; --serif:"Inter Tight",Inter,-apple-system,system-ui,sans-serif;
}
html,body{font-family:var(--ui)}
/* Fonds : blanc partout */
#phone .layer,#phone .phone,#phone .scroll,#phone .dock{background:#FFFFFF}
/* Titres : Inter Tight gras et resserré */
.t-large{font:700 34px/1.05 var(--ui) !important;letter-spacing:-.03em !important}
.t-title2{font:700 24px/1.15 var(--ui);letter-spacing:-.02em}
.t-title3{font:600 19px/1.2 var(--ui);letter-spacing:-.01em}
.t-book{font:600 26px/1.15 var(--ui) !important;letter-spacing:-.02em !important}
.t-book-m{font:600 18px/1.25 var(--ui) !important;letter-spacing:-.01em !important}
.brow .tt,.bk-t{font-family:var(--ui) !important;font-weight:500}
/* Zone de couverture : gris doux */
#phone .hero{background:var(--sand) !important}
/* Surfaces d'intelligence : fond indigo très pâle, libellé indigo */
#phone .ai,#phone .ai.sm,#phone .bm,#phone .sd-ai{background:var(--gl-ai-bg) !important;box-shadow:none !important;border:0 !important}
#phone .ai-mark,#phone .ai-mark svg,#phone .bm .label,#phone .smart-badge,#phone .sd-ai .sd-ico{color:var(--gl-ai) !important}
#phone .ai-mark{font:600 12px/1.3 var(--ui) !important;letter-spacing:.02em !important}
#phone .ai-lead{font:600 18px/1.25 var(--ui) !important;letter-spacing:-.01em !important;color:var(--ink)}
#phone .ai-tag{background:rgba(75,63,209,.1);color:var(--gl-ai)}
/* Cartes et listes : filet très clair au lieu du contour noir */
#phone .group{border:1px solid var(--hairline) !important}
#phone .row,#phone .brow,#phone .nrow,#phone .learn{border-bottom-color:var(--hairline)}
/* Puces : contour gris clair, sélection en encre */
#phone .tag{border:1px solid var(--gl-line) !important;background:transparent}
#phone .tag.on{background:var(--ink);border-color:var(--ink) !important;color:#fff}
#phone .tag.off{border:1px dashed var(--gl-line) !important}
#phone .choice,#phone .feel button{border:1px solid var(--gl-line) !important}
#phone .choice[aria-checked="true"],#phone .feel button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink) !important}
/* Champs : pilule gris doux, sans contour */
#phone .field{background:var(--sand) !important;border:1px solid var(--sand) !important}
#phone .area{border:1px solid var(--sand) !important;background:var(--sand)}
/* Barre d'onglets : blanche, filet clair en haut */
#phone .dock{border-top:1px solid var(--hairline) !important;background:rgba(255,255,255,.92) !important;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
#phone .tab{color:var(--stone-text)}
#phone .tab[aria-current="page"]{color:var(--ink)}
/* Feuilles, menus, cartes d'univers : filets clairs */
#phone .sheet{border-top:0 !important;box-shadow:0 -8px 30px rgba(0,0,0,.08) !important}
#phone .sheet-head{border-bottom:1px solid var(--hairline) !important}
#phone .ucard,#phone .smart-drop{border-color:var(--hairline) !important}
/* Couvertures : ombre douce de galerie */
.cv{box-shadow:0 1px 2px rgba(0,0,0,.08),0 12px 28px rgba(0,0,0,.12)}
/* Rail du contrôle segmenté et barres de progression */
#phone .seg{background:var(--sand) !important}
#phone .progress i,#phone .bar{background:#ECECEA !important}
#phone .b[disabled]{background:#ECECEA !important;border-color:#ECECEA !important;color:#8A8A85 !important}

/* Couverture générée — direction 02 « Cadre classique » : papier crème, double filet, Garamond centré.
   Utilisée seulement quand un livre n'a pas de vraie couverture. Toutes les tailles sont en em (1em = 1/10 de la largeur). */
#phone .cv.cv-cl{background:#F2ECDD;color:#2A2A2A;font-family:"Inter Tight",sans-serif}
#phone .cv-cl .f1{position:absolute;inset:.5em;border:.06em solid var(--c)}
#phone .cv-cl .f2{position:absolute;inset:.72em;border:.03em solid var(--c)}
#phone .cv-cl .in{position:absolute;inset:0 1.2em;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.45em}
#phone .cv-cl .au{font-size:.5em;letter-spacing:.14em;text-transform:uppercase;line-height:1.2}
#phone .cv-cl .rule{width:1.6em;height:.04em;background:var(--c)}
#phone .cv-cl .ti{font-family:"EB Garamond",serif;font-weight:500;line-height:1.05;color:var(--c);overflow-wrap:break-word;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
#phone .cv-cl .sub{font-family:"EB Garamond",serif;font-style:italic;font-size:.52em}
#phone .cv-cl .sig{position:absolute;left:0;right:0;bottom:2.9em;padding-left:.3em;line-height:1;text-align:center;font-family:"EB Garamond",serif;font-size:.42em;letter-spacing:.3em;color:var(--c)}
#phone .cv-cl.t-s .au,#phone .cv-cl.t-s .rule,#phone .cv-cl.t-s .sig,#phone .cv-cl.t-s .sub,#phone .cv-cl.t-m .sub{display:none}

/* ===== Piste F : Recommandé pour vous ===== */
#phone .rec{margin-top:24px;display:flex;flex-direction:column;gap:14px}
#phone .rec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
#phone .rec-head h2{margin:4px 0 2px}
#phone .rec-head .b-text{min-height:44px}
#phone .rec-first{display:flex;gap:16px;align-items:flex-start;background:var(--sand);border-radius:20px;padding:16px}
#phone .rec-cover{appearance:none;border:0;background:none;padding:0;cursor:pointer;flex:none}
#phone .rec-first-txt{display:flex;flex-direction:column;gap:6px;min-width:0;padding-top:4px}
#phone .rec-first-txt h3{margin:0}
#phone .rec-kicker{font:600 12px/16px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--stone-text,#6E6E6A)}
#phone .linkish{appearance:none;border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
#phone .aff{align-self:flex-start;display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;border:1px solid var(--ink);font:600 12px/1 var(--ui);color:var(--ink);white-space:nowrap}
#phone .rec-first-why{margin:0}
#phone .rec-first-act{display:flex;gap:8px;align-items:center}
#phone .rec-more{appearance:none;flex:none;width:44px;height:44px;border-radius:999px;border:1px solid var(--line,#D9D9D5);background:transparent;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
#phone .rec-more svg{width:20px;height:20px}
#phone .rec-more[aria-expanded="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

// Profil = préférences déclarées + ce qui est appris des avis + signaux (« Pas pour moi »)
function derive(){
  const F={}; Object.keys(FEAT).forEach(k=>F[k]={s:0,src:[],decl:0});
  const add=(k,d,src)=>{ if(!F[k])return; F[k].s+=d; if(src&&!F[k].src.includes(src))F[k].src.push(src); };
  for(const [k,v] of Object.entries(S.prefs.narr)){ if(v&&F[k]){ F[k].s+=v*1.5; F[k].decl=v; } }
  const LU={}; let short=0; const adored=[],liked=[],disliked=[];
  for(const [id,e] of Object.entries(S.lib)){
    const b=BY[id]; if(!b||!e.feeling) continue;
    const w=FEEL[e.feeling].w, wn=e.status==="abandon"?1:FEEL[e.feeling].wn;
    (e.pos||[]).forEach(r=>{ const def=POSM[r]; if(!def||!w) return;
      if(def==="STYLE") STYLEF.forEach(f=>{ if((b.f[f]||0)>=.4) add(f,w*b.f[f],id); });
      else Object.entries(def).forEach(([f,x])=>add(f,w*x,id)); });
    (e.neg||[]).forEach(r=>{ const def=NEGM[r]; if(!def) return;
      if(def==="STYLE-") STYLEF.forEach(f=>{ if((b.f[f]||0)>=.5) add(f,-wn*b.f[f],id); });
      else if(def==="SUJET") b.univ.forEach(u=>LU[u]=(LU[u]||0)-wn*.8);
      else if(def==="LONG") short+=wn;
      else Object.entries(def).forEach(([f,x])=>add(f,wn*x,id)); });
    const uw={coeur:.8,aime:.5,neutre:0,pasaime:-.4}[e.feeling]; b.univ.forEach(u=>LU[u]=(LU[u]||0)+uw);
    if(e.feeling==="coeur") adored.push(id); else if(e.feeling==="aime") liked.push(id); else if(e.feeling==="pasaime") disliked.push(id);
  }
  S.signals.forEach(s=>add(s.f,s.d,null));
  Object.keys(S.locks).forEach(k=>{ if(S.locks[k]&&F[k]) F[k]={s:0,src:[],decl:0,locked:true}; });
  return {F,LU,short,adored,liked,disliked};
}

function score(b,p){
  const P=S.prefs, c={};
  let u=0; if(b.univ.some(x=>P.univ[x]===1)) u+=1; if(P.sub.includes(b.sub)) u+=.6;
  u+=Math.min(.5,b.themes.filter(t=>P.themes.includes(t)).length*.25);
  b.univ.forEach(x=>u+=(p.LU[x]||0)*.4); c.U=clamp(u,-1.2,1.2)/1.2;
  let num=0,den=0; for(const [k,v] of Object.entries(b.f)){ const s=p.F[k]?p.F[k].s:0; num+=v*clamp(s/2.5,-1,1); den+=v; } c.N=den?num/den:0;
  const simA=Math.max(0,...p.adored.map(id=>sim(b,BY[id])),...p.liked.map(id=>sim(b,BY[id])*.7));
  const simD=Math.max(0,...p.disliked.map(id=>sim(b,BY[id])));
  c.H=clamp(simA-.7*simD+(favAuthor(b.author)?.6:0),-1,1);
  c.M=T.mood?moodScore(b,T.mood):0;
  let d=0; const L=P.habits.longueur;
  if(L==="courts") d+=b.pages<260?1:b.pages>450?-1:0; else if(L==="moyens") d+=b.pages>=200&&b.pages<=480?.6:-.4; else if(L==="longs") d+=b.pages>450?1:b.pages<220?-.6:0;
  if(p.short>0&&b.pages>500) d-=Math.min(1,p.short*.5);
  const D=P.habits.difficulte, ex=b.f.ex||0;
  if(D==="faciles") d+=(b.f.fl||0)*.6-ex; else if(D==="exigeantes") d+=ex-.2; else if(D==="equilibre") d+=.3-Math.abs(ex-.4);
  if(P.habits.seance==="15") d+=((b.f.fl||0)+(b.f.ry||0))*.2;
  c.D=clamp(d,-1,1);
  c.P=P.formats.length?(P.formats.some(f=>b.ed[f]&&b.ed[f].avail)?1:-.5):0;
  const pen=Math.min(.3,(S.skips[b.id]||0)*.12)-Math.min(.06,(S.viewed[b.id]||0)*.02);
  const W=T.mood?{U:.22,N:.25,H:.1,M:.28,D:.1,P:.05}:{U:.3,N:.3,H:.15,M:.1,D:.1,P:.05};
  return {t:W.U*c.U+W.N*c.N+W.H*c.H+W.M*c.M+W.D*c.D+W.P*c.P-pen,c,W};
}

function why(b,p,r=score(b,p)){
  const P=S.prefs, parts=[], src=[];
  const W=r.W||{U:.3,N:.3,H:.15,M:.1,D:.1};
  const order=[["U",W.U*r.c.U],["N",W.N*r.c.N],["H",W.H*r.c.H],["M",W.M*r.c.M],["D",W.D*r.c.D]].filter(x=>x[1]>.025).sort((a,b)=>b[1]-a[1]);
  for(const [k] of order){

    if(k==="U"){ const lu=b.univ.find(x=>P.univ[x]===1)||b.univ.find(x=>(p.LU[x]||0)>.9);
      const s=P.sub.includes(b.sub)?subPhrase(b.sub):lu?UPH[lu]:null; if(s) parts.push(`vous aimez ${s}`); }
    if(k==="N"){ const sh=Object.entries(b.f).filter(([f,v])=>v>=.6&&!FEAT[f].bad&&p.F[f]&&p.F[f].s>.5).sort((x,y)=>p.F[y[0]].s*y[1]-p.F[x[0]].s*x[1]).slice(0,2);

// Couverture « Cadre classique » : 3 niveaux de détail selon la taille (s : titre seul, m : + auteur, l : + sous-genre)
function coverClassic(b,w){
  const c=CL_COLOR[b.univ[0]]||"#3A2E1E";
  const tier=w>=140?"t-l":w>=80?"t-m":"t-s";
  const tt=b.title.replace(" (titre à venir)",""); const L=tt.length;
  // Taille du titre selon sa longueur (≈ 10 % de la largeur pour un titre court), un peu plus grande en vignette 56 px pour rester lisible
  const k=(L<=8?1.05:L<=14?.95:L<=22?.85:.75)*(tier==="t-s"?1.25:1);
  return `<div class="cv cv-cl ${tier}" style="width:${w}px;font-size:${(w/10).toFixed(1)}px;--c:${c}" aria-hidden="true"><span class="f1"></span><span class="f2"></span>
    <div class="in"><span class="au">${esc(b.author)}</span><span class="rule"></span><span class="ti" style="font-size:${k.toFixed(2)}em">${esc(tt)}</span><span class="sub">${esc(b.sub||"")}</span></div><span class="sig">B · M</span></div>`;
}
// ===== Couvertures rapides =====
const coverSrc=(id,w)=>`covers/${id}.jpg`;
const IMG_OK=new Set();   // images déjà chargées dans cette session
// Quand une image a fini de charger : on la mémorise et on la fait apparaître en fondu
document.addEventListener("load",e=>{ const im=e.target; if(im&&im.classList&&im.classList.contains("rm-cover")){ if(im.naturalWidth>=250&&im.naturalHeight>im.naturalWidth*1.2) im.classList.add("in"); else { RM_BAD.add(im.getAttribute("src")); im.remove(); } return; } },true);
document.addEventListener("error",e=>{ const im=e.target; if(im&&im.classList&&im.classList.contains("rm-cover")){ RM_BAD.add(im.getAttribute("src")); im.remove(); } },true);
document.addEventListener("load",e=>{ const t=e.target; if(t&&t.tagName==="IMG"&&t.closest&&t.closest(".cv-img")){ IMG_OK.add(t.getAttribute("src")); t.classList.add("in"); } },true);
// Préchargement discret des couvertures probables (recommandations du moment), quand le téléphone est libre
function preloadCovers(ids,big){ const idle=window.requestIdleCallback||(f=>setTimeout(f,300));
  idle(()=>ids.slice(0,40).forEach(id=>{ if(!REAL_COVERS.has(id)) return; const src=coverSrc(id,big?150:96); if(IMG_OK.has(src)) return;
    const im=new Image(); im.decoding="async"; im.onload=()=>IMG_OK.add(src); im.src=src; })); }

function cover(b,w,fs){
  if(REAL_COVERS.has(b.id)){
    const bg=sprStyle(b.id);
    // Petite vignette : la miniature de la planche suffit (nette jusqu'à 75 px)
    if(w<=75 && bg) return `<div class="cv cv-img" style="width:${w}px;font-size:${fs}px;${bg}" aria-hidden="true"></div>`;
    // Grande couverture : la miniature s'affiche tout de suite, l'image HD se pose par-dessus en fondu
    const src=coverSrc(b.id,w);
    const att=IMG_OK.has(src)?'decoding="sync"':'loading="lazy" decoding="async" class="fade"';
    return `<div class="cv cv-img" style="width:${w}px;font-size:${fs}px;${bg}" aria-hidden="true"><img src="${src}" alt="" ${att}></div>`;
  }
  if(b.cover&&!RM_BAD.has(b.cover)) return `<div class="cv-wrap" style="width:${w}px">${coverClassic(b,w)}<img class="rm-cover" src="${esc(b.cover)}" alt="" loading="lazy" referrerpolicy="no-referrer"></div>`;
  return coverClassic(b,w);
  const h=hash(b.id), comp=h%4, k=(h>>>3)%8, st=`style="width:${w}px;font-size:${fs}px"`;
  const tt=b.title.replace(" (titre à venir)",""); const lg=(tt.length>24||Math.max(...tt.split(/\s+/).map(x=>x.length))>7)?" long":"";
  const au=esc(b.author), ti=esc(tt);
  if(comp===0) return `<div class="cv cv-a k${k}${lg}" ${st} aria-hidden="true"><span class="au">${au}</span><span class="ti">${ti}</span></div>`;
  if(comp===1) return `<div class="cv cv-b k${k}${lg}" ${st} aria-hidden="true"><span class="fr"></span><div class="in"><span class="ti">${ti}</span><span class="au">${esc(lastName(b.author))}</span></div></div>`;
  if(comp===2) return `<div class="cv cv-c k${k}${lg}" ${st} aria-hidden="true"><div class="tp"><span class="au">${au}</span></div><div class="band"><span class="ti">${ti}</span><span class="ed">${b.univ.includes("Littérature graphique")?"Album":"Poche"}</span></div></div>`;
  return `<div class="cv cv-d k${k}${lg}" ${st} aria-hidden="true"><span class="sh"></span><span class="au">${au}</span><span class="ti">${ti}</span></div>`;
}

  const keep={}; phone.querySelectorAll("[data-scroll]").forEach(el=>keep[el.dataset.scroll]=el.scrollTop);
  let h="";
  if(S.mode==="entry"){ S.mode="onb"; } if(false) h=vEntry();
  else if(S.mode==="onb") h=vOnb();
  else {
    h=`<div class="layer">${vTab()}</div><div class="fadebar"></div>${dock()}`;
    T.stack.forEach((s,i)=>{ const top=i===T.stack.length-1; h+=`<div class="layer pushed ${top&&T.anim==="push"?"push-enter":""}">${VIEWS[s.v](s)}</div>`; });
  }
  if(T.sheet) h+=`<div class="scrim ${T.anim==="sheet"?"fade-enter":""}" data-a="closeSheet"></div>`+SHEETS[T.sheet.v](T.sheet);
  if(T.toast) h+=`<div class="toast" role="status"><span style="display:flex;align-items:center;gap:10px">${ico("check")}${esc(T.toast.msg)}</span>${T.toast.undo?`<button data-a="undo">Annuler</button>`:""}</div>`;
  phone.innerHTML=h;
  if(T.anim==null) phone.querySelectorAll("[data-scroll]").forEach(el=>{ if(keep[el.dataset.scroll]!=null) el.scrollTop=keep[el.dataset.scroll]; });
  T.anim=null;
  const af=phone.querySelector("[data-autofocus]"); if(af) af.focus({preventScroll:true});
}
function toast(msg,undo){T.toast={msg,undo}; clearTimeout(T.tt); T.tt=setTimeout(()=>{T.toast=null;render()},3200);}
function push(v,o={}){T.stack.push(Object.assign({v},o));T.anim="push";render()}
function pop(){T.stack.pop();render()}
function sheet(v,o={}){T.sheet=Object.assign({v},o);T.anim="sheet";render()}
function closeSheet(){T.sheet=null;render()}

// ===== ADN de lecteur (fin d'onboarding) =====
const GOUT={"Polar":"des enquêtes","Thriller":"du frisson","Romance":"des histoires d'amour","Science-fiction":"des futurs possibles","Fantasy":"des mondes imaginaires",
  "Fantastique":"de l'étrange","Littérature classique":"des grands classiques","Fiction contemporaine":"des récits d'aujourd'hui","Littérature étrangère":"des voix d'ailleurs",
  "Aventure":"de l'aventure","Nouvelles":"des histoires courtes","Poésie":"de la poésie","Littérature graphique":"du roman graphique","Développement personnel":"des livres qui font avancer",
  "Psychologie":"de l'esprit humain","Philosophie":"des idées","Histoire":"de l'Histoire","Biographie":"des vies singulières","Essais":"des idées"};
function readerDNA(p){
  const P=S.prefs, us=Object.keys(P.univ).filter(u=>P.univ[u]===1);
  const lu=Object.entries(p.LU).filter(([,v])=>v>.9).sort((a,b)=>b[1]-a[1]).map(([u])=>u);
  const top=[...new Set([...us,...lu])].slice(0,2); const {want,avoid}=lists(p);
  const g=[...new Set(top.map(u=>GOUT[u]).filter(Boolean))];
  const title=g.length?"Le goût "+g.join(" et "):"Un lecteur curieux de tout";
  const traits=[];
  if(top.length) traits.push({i:"books",t:join(top.map((u,i)=>i?u.charAt(0).toLowerCase()+u.slice(1):u)),s:"Vos univers principaux",step:"univers"});
  if(want.length) traits.push({i:"heart",t:cap(join(want.slice(0,2).map(([k])=>FEAT[k].phr))),s:"Ce que vous cherchez dans un livre",step:"reasons"});
  const L=P.habits.longueur; if(L&&L!=="any") traits.push({i:"ruler",t:HABITS[2].o.find(x=>x[0]===L)[1],s:"La longueur que vous préférez",step:"quick"});
  if(avoid.length) traits.push({i:"close",t:"Pas de "+FEAT[avoid[0][0]].nphr.replace(/^(les |la |le |l')/,""),s:"Ce que vous évitez",step:"reasons"});
  const n=S.onb.picks.length; if(n) traits.push({i:"star",t:`D'après ${n} livre${n>1?"s":""} aimé${n>1?"s":""}`,s:S.onb.picks.slice(0,2).map(id=>BY[id].title).join(", ")+(n>2?"…":""),step:"books"});
  return {title,traits:traits.slice(0,4)};
}

function onbResults(q){

  const list0=BOOKS.filter(b=>!b.future&&(n?!b.ext&&norm(b.title+" "+b.author).includes(n):!b.ext)).sort((a,b)=>n?0:(b.univ.some(u=>S.prefs.univ[u]===1)?1:0)-(a.univ.some(u=>S.prefs.univ[u]===1)?1:0)).slice(0,n?10:6);
  const list=n?[...list0,...remoteIds(q).map(id=>BY[id]).filter(b=>b&&!list0.includes(b))].slice(0,20):list0;
  if(!list.length&&n.length>=3&&!REMOTE[n]) return `<p class="t-sub muted" style="padding:20px 0">Recherche dans tout le catalogue…</p>`;
  if(!list.length) return `<p class="t-sub muted" style="padding:20px 0">Aucun résultat. Essayez l'auteur seul ou l'ISBN.</p>`;
  return `<p class="t-foot muted" style="margin:16px 0 0">${n?"Résultats":"Suggestions selon vos univers"}</p>`+list.map(b=>{const on=o.picks.includes(b.id);return bkRow(b,`<span class="tag ${on?"on":""}" style="height:32px;padding:0 12px;font-size:13px;pointer-events:none" aria-hidden="true">${on?ico("check")+"Choisi":"Choisir"}</span>`,null,"pick").replace('data-a="pick"',`data-a="pick" aria-pressed="${on}"`)}).join("");
}

function seeded(arr,seed){ const a=arr.slice(); let s=seed*9301+49297; for(let i=a.length-1;i>0;i--){ s=(s*9301+49297)%233280; const j=Math.floor(s/233280*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function heroPick(p){
  let all=candidates(p);

  if(T.mood){ const fit=all.filter(x=>moodScore(x.b,T.mood)>=.45); if(fit.length>=3) all=fit.concat(all.filter(x=>!fit.includes(x))); }

// ===== Piste F : recommandations sur Découvrir =====
// Affinité en mots courts (pas de pourcentage)
const affShort=t=>t>.33?"Très proche":t>.18?"Proche":t>.05?"À découvrir":"Pour changer";
// Raison courte d'une recommandation : première raison de why(), sans « Parce que »
function shortWhy(b,p,r){
  // On garde la raison la plus précise : un livre aimé, puis un auteur, puis un style d'écriture, sinon l'univers
  const parts=why(b,p,r).text.replace(/^Parce que /,"").replace(/\. Peu de violence\.$/,"").replace(/\.$/,"").split(/, que | et que /);
  const pick=parts.find(x=>x.includes("«"))||parts.find(x=>x.startsWith("vous aimez ")&&x.includes(b.author))||parts.find(x=>x.includes("appréciez"))||parts[0];
  return cap(pick.replace(/^vous avez (adoré|apprécié) /,"Comme ").replace(/^vous appréciez /,"Pour ").replace(/^vous aimez /,"Vous aimez "));
}
// Liste ordonnée des recommandations (sans les livres déjà écartés ou passés)
// Envies proposées sur Découvrir, selon le profil :
// 1) les envies cochées par le lecteur, 2) celles qui offrent le plus de livres proches de ses goûts,
// 3) une tuile « Découverte » pour sortir de ses habitudes. Une envie avec trop peu de livres n'est pas proposée.
function profileMoods(list){
  const pool=list.slice(0,60);                       // les 60 livres les plus proches du profil
  const fit=k=>{ const m=pool.filter(x=>moodScore(x.b,k)>=.3);
    return {k,n:m.length,s:m.slice(0,10).reduce((a,x)=>a+Math.max(0,x.r.t)+moodScore(x.b,k)*.3,0)}; };
  const ranked=Object.keys(MOODS).filter(k=>k!=="decouverte").map(fit).filter(x=>x.n>=4).sort((a,b)=>b.s-a.s).map(x=>x.k);
  const fav=S.prefs.moods.filter(k=>MOODS[k]&&k!=="decouverte");
  const disco=list.filter(x=>moodScore(x.b,"decouverte")>=.3).length>=4?["decouverte"]:[];
  const main=[...fav,...ranked.filter(k=>!fav.includes(k))];
  return [...main.slice(0,6-disco.length),...disco,...main.slice(6-disco.length)];
}

function becauseRail(p,exclude){
  // Livre de départ : de préférence un livre aimé dans les univers choisis à l'accueil
  const lu=Object.keys(S.prefs.univ).filter(u=>S.prefs.univ[u]===1), cand=[...p.adored,...p.liked].filter(id=>BY[id]);
  const inLu=cand.filter(id=>BY[id].univ.some(u=>lu.includes(u))), srcs=inLu.length?inLu:cand; if(!srcs.length) return null;
  const src=srcs[VISIT%srcs.length];   // un livre différent à chaque visite
  const s=BY[src];
  // Ce que le lecteur a dit aimer dans CE livre (raisons de l'accueil ou de l'avis) → axes à retrouver
  const why=(S.lib[src]&&S.lib[src].pos)||[], ax={};
  why.forEach(k=>{ const m=POSM[k]; if(m==="STYLE") STYLEF.forEach(f=>ax[f]=(ax[f]||0)+.4); else if(m) Object.entries(m).forEach(([f,w])=>ax[f]=(ax[f]||0)+w); });
  const axW=Object.values(ax).reduce((a,w)=>a+Math.abs(w),0);
  const fit=b=>axW?Object.entries(ax).reduce((a,[f,w])=>a+w*(b.f[f]||0),0)/axW:0;
  const likedU=Object.keys(S.prefs.univ).filter(u=>S.prefs.univ[u]===1);
  // Score : proche du livre, mais aussi des univers choisis à l'accueil et des raisons données
  const pool=BOOKS.filter(b=>!b.future&&!(b.ext&&!b.tagged)&&!S.lib[b.id]&&!S.hidden[b.id]&&!exclude.includes(b.id)&&!rejected(b))

      return {b,si,s:.35*si+.3*pr+.2*fit(b)+(inU?.15:-.1)+(sameA&&why.includes("auteur")?.35:sameA?.1:0)}; })
    .filter(x=>x.si>.3&&x.s>.3).sort((a,b)=>b.s-a.s).slice(0,16)

  if(pool.length<3) return null;
